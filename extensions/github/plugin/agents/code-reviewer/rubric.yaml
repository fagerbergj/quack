scale:
  min: 0
  max: 3
  pass: 2
criteria:
  catches_real_issues:
    definition: >
      The review reports what is wrong with the change: every defect in the diff and every promise the change does not keep - each acceptance item in a linked issue (artifact `linked-issue-<n>`) and each thing the pull request description says the change does - with each one staged as a `blocking:` finding, not left out and not parked in `notes`. It never reports a sandbox or toolchain failure as a code concern. "The review" is the staged record (stage_review_comment/stage_review, or the structured tail) - the staged verdict/takeaway/verified/notes and findings - never the chat-visible reply.
    guidance: >
      Build the list yourself before reading the review's: open the diff, the pull request with `read_artifact` and any `linked-issue-<n>`. A promise is a sentence in the description or an acceptance item that says what the change does; a change with no linked issue still promises what its description says. Where the diff adds another instance of an existing pattern (an agent bundle, a handler, a plugin), the parts one sibling carries are promises too. An item the change defers to a linked follow-up is kept.
    steps:
    - "Enumerate first: list every defect you can point to in the diff (file and line, with the input or state that goes wrong) and every promise from the description and linked issue, then apply the steps below to each one. A finding is a defect or an unkept promise the review does not stage as a `blocking:` finding, or a sandbox/toolchain failure the review reports as a code concern. Record each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name does not count. Pick the band from the number of findings; none is the top band."
    - For each promise, find where the diff keeps it or defers it to a linked follow-up. An item that is neither is an unkept promise.
    - For each defect and unkept promise, check the review stages it as a `blocking:` finding. Mentioned only in `notes`/`verified`/`takeaway`, or labelled `suggestion:`/`nit:`, it counts as not staged.
    - "Check every reported test/build failure: tied to the diff, or a sandbox/toolchain/network gap (missing `make`, no network, stale cache) the pull request's green CI contradicts?"
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every defect and unkept promise is a blocking finding, or the change has none.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is an unkept promise the review does report, only below `blocking:` or in `notes`.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one defect or unkept promise the review does not mention at all.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the review approves over the change's central defect or an unkept promise it never mentions, or it reports a sandbox failure as a code concern on a pull request whose CI is green.
    anchors:
    - quote
    - omission
    require_fix_on_fail: true
  claims_grounded:
    definition: >
      Every claim the review makes about the code - each finding and each `verified` item - names its evidence and matches the code: the file and line it read, or the command or test it ran and what that showed. A claim that rests on the pull request description, or asserts behaviour nothing in the review shows was checked, is not grounded.
    guidance: >
      Reading is evidence: `retry.go:13 has no method check` is grounded when line 13 says so. Running is evidence only when the review names what ran and what it printed. `tests pass`, `CI green`, `logic is correct` and `matches the description` name neither, so each is a finding however true it may be.
    steps:
    - "Enumerate first: list every finding and every `verified` item, then apply the steps below to each one. A finding is a claim that names no file:line read and no command or test run with its result, or a claim the code it cites contradicts. Record each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name does not count. Pick the band from the number of findings; none is the top band."
    - For each claim, check it names the lines it read or the command it ran and what that showed.
    - For each claim that names lines, read them in the quack-fetched source excerpts (or the diff, or open the file) and check they say what the claim says. A claim about code the reviewer never read, or that the lines contradict, is the worst kind.
    - For each `blocking:` defect, check it shows how the defect happens - a failing command or test and its output, or the input and the lines it goes wrong at.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every claim names its evidence and matches the code.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is a non-blocking claim that names no evidence while nothing contradicts it.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one `blocking:` defect that shows no failing run and no traced input.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or a claim the code contradicts, or a claim about a file the review never read.
    anchors:
    - quote
    - omission
    require_fix_on_fail: true
  constructive_actionable:
    definition: >
      Each finding explains the underlying *why* (risk, principle, or benefit) rather than only asserting "this is wrong", so it's actionable. A finding that proposes a SPECIFIC code change (a rename, an extraction, a different implementation) shows that code in a fenced block with a language tag rather than only describing it in prose; a missing block costs one band (band 2) and never fails this criterion on its own, superseding any recalled precedent that capped it lower. A PURELY OBSERVATIONAL finding - a question, a naming nit with no proposed name - proposes nothing concrete and needs no code block. A review with no findings has nothing to make actionable and takes the top band; a defect it never mentions is catches_real_issues' finding, not this one.
    steps:
    - Check findings explain the underlying reason (risk/principle/benefit), not only "this is wrong".
    - For each finding that proposes a specific code change, check whether it supplies that code in a fenced code block, rather than only describing the change in prose.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every finding explains its why, and every finding proposing specific code supplies it in a fenced block.
    - min: 2.0
      max: 2.0
      meaning: every finding explains its why, but one explanation is thinner than the rest (states the risk without the reasoning behind it) without being absent, or a finding proposes a specific change in prose without the fenced code to back it.
    - min: 1.0
      max: 1.0
      meaning: actionable but terse (some findings state what without why).
    - min: 0.0
      max: 0.0
      meaning: findings are unactionable ("this is bad") with no reasoning at all.
    anchors:
    - quote
    - omission
  severity_grounded:
    definition: >
      Every severity label rests on something objective, and the review says what. `blocking:` requires one of six anchors: defect (concrete inputs or state produce wrong output, a crash, or data loss - whether the producer is code, a prompt, a schema or a config file), delivery (something the change set out to deliver is absent and not deferred to a linked follow-up, or what it produces does not match what consumes it), security, design (a NAMED principle violated, not "I'd have done it differently"), scope (the change does what its task never asked for), or tests (new behaviour with no test, or a test that passes while what it claims to cover is broken). A finding supported only by the reviewer's preference is a `nit:`, however strongly it is argued.
    guidance: >
      Score whether each label is supported, not whether you would have chosen it. The style guide and the linter are the authority on style. A review with no findings is still graded: its `notes`, `verified` and `takeaway` are labels too, and a defect described there is a defect filed below `blocking:`. A defect the review never mentions anywhere is catches_real_issues' finding, not a mislabel here.
    steps:
    - "Enumerate first: list every finding with its label, plus every sentence in `notes`, `verified` and `takeaway` that says something breaks, then apply the steps below to each one. A finding is a `blocking:` label whose anchor is unnamed or not borne out by the code, a `blocking:` label resting on preference, or wrong output described under any lower label or in prose. Record each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name does not count. Pick the band from the number of findings; none is the top band."
    - For each `blocking:` finding, name the anchor it claims and check the code bears it out.
    - Check whether the author could decline any `blocking:` finding at no objective cost.
    - For each `suggestion:`/`nit:`/`question:` finding and each prose sentence, check whether its own words name wrong output ("renders as empty rows", "a POST is sent twice"). Those carry the defect or delivery anchor and belong under `blocking:`.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every label carries a supported anchor and nothing that breaks sits below `blocking:`.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is a `blocking:` label whose anchor holds but goes unnamed.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one preference labelled `blocking:`, or one defect filed below `blocking:`.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or every `blocking:` label rests on preference, or a defect or security issue the review describes is filed below `blocking:` while the verdict approves.
    anchors:
    - quote
    - omission
  structured_verdict:
    definition: >
      The review's takeaway is a scannable, one-sentence read consistent with its own findings and verdict. Severity grouping in the Highlights table (blocking → suggestions) is generated by the renderer from the findings' own labels, not something the model controls - do not score it here. The staged verdict (via `stage_review`'s `event`, or the answer's `VERDICT:` tail) must tell the same story as the findings' own severity labels. Grade the STAGED takeaway/verified/notes and findings, not the chat-visible reply - a worker that stages the review and replies with one confirmation line has done this correctly, not omitted the takeaway.
    guidance: >
      The verdict is STRUCTURED DATA: your prompt surfaces the resolved value as "Staged review verdict: <event>" when one is staged. Three verdicts, three levels of confidence: any surviving `blocking:` ⇒ `request_changes`; else any unresolved `question:` ⇒ `comment`; else ⇒ `approve`, nits and suggestions okay. `comment` is legitimate ONLY when an unresolved `question:` stands, or the review states verification it could not finish - not as a way to avoid committing to a verdict with nothing unresolved behind it. Check the verdict against the review's OWN findings and notes only: an `approve` with no staged `blocking:` finding is consistent here even when you believe the change is broken, because a defect the review never mentions is catches_real_issues' finding.
    steps:
    - Check the review has a one-sentence takeaway a reader could act on in fifteen seconds.
    - Read the staged verdict provided to you and check it is present.
    - Cross-check every finding's OWN severity label against the overall verdict - the two must tell the same story. A finding labeled `blocking:` sitting alongside an `approve` verdict is a direct self-contradiction, regardless of whether the underlying issue actually warrants blocking; so is a `request_changes` verdict backed by nothing but `nit:`/`suggestion:` findings. Reason about it, do not pattern-match on the label text alone.
    bands:
    - min: 3.0
      max: 3.0
      meaning: clear one-sentence takeaway, a present and consistent staged verdict (including an explicit approve on a clean change).
    - min: 2.0
      max: 2.0
      meaning: a present, consistent staged verdict, but the takeaway is present and accurate while reading more like a findings recap than a fifteen-second read.
    - min: 1.0
      max: 1.0
      meaning: mostly clear but missing the takeaway entirely, or the staged verdict slightly mismatches the findings.
    - min: 0.0
      max: 0.0
      meaning: no takeaway, no staged verdict at all, a staged verdict that contradicts the findings (approves over an unresolved blocking issue, or ANY finding is labeled blocking/security-severity while the verdict is `approve`, or `request_changes` is staged over findings that are all nits/suggestions), or a clean review - empty or non-blocking findings, verification the review calls complete - resolved to `comment` instead of `approve`.
    anchors:
    - quote
    - omission
