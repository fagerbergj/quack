# Managed-topology example: `quack server` brings up Postgres + Qdrant itself
# via an embedded docker-compose stack, waits for them, then runs pointed at
# them. The no-hand-setup full stack (needs docker + host ports 5432/6334 free).
#
#   export QUACK_LLM_ENDPOINT="http://your-llm:11436/v1" QUACK_LLM_API_KEY="unused"
#   export QUACK_ORCH_MODEL="qwen3.6-35b" QUACK_RESEARCHER_MODEL="qwen3.6-35b"
#   export QUACK_JUDGE_MODEL="gemma4-26b-a4b" QUACK_EMBED_MODEL="qwen3-embed"
#   ./quack server start --config config/managed.yaml
#   ./quack server status  --config config/managed.yaml
#   ./quack server stop    --config config/managed.yaml   # tears down stores too
#
# Tool backends (search/fetch) are NOT managed. This preset uses Exa's keyless
# hosted MCP for search (no API key, no container) and a direct GET for fetch -
# so the whole stack is zero-config beyond the LLM endpoint.
providers:
  default:
    kind: openai
    endpoint: ${QUACK_LLM_ENDPOINT}
    api_key: ${QUACK_LLM_API_KEY}

stores:
  # The managed stack publishes Postgres on localhost:5432 and Qdrant on :6334.
  default_postgres:
    kind: postgres
    url: postgres://quack:quack@localhost:5432/quack?sslmode=disable
  default_vector:
    kind: qdrant
    url: localhost:6334
    embedder:
      provider: default
      model: ${QUACK_EMBED_MODEL}
    consolidation:
      provider: default
      model: ${QUACK_JUDGE_MODEL}
    top_k: 5
    min_score: 0.5

session:
  store: default_postgres

orchestrator:
  # see config/quack.yaml's orchestrator.skills comment for the routing rationale.
  skills: [plan-work, format-markdown, present-coding-plan, contribute]
  provider: default
  model: ${QUACK_ORCH_MODEL}
  tools: [web_search, web_fetch, summarize, current_date]

agents:
  web-researcher:
    bundle: agents/web-researcher
    skills: [format-markdown, research-git-repos]
    provider: default
    memory:
      bucket: research   # shared-memory role bucket (see internal/memory/scope.go)
    model: ${QUACK_RESEARCHER_MODEL}
    context_window: 65536
    judge_rounds: 1             # research converges in one draft; extra rounds burn tokens re-fetching to fix citations. Draft must cite inline (see prompt.md).
    tools: [web_search, web_fetch, summarize, current_date, stage_memory, ask_advisor]
    # no skills scoped: see config/quack.yaml's web-researcher comment
  code-implementer:
    bundle: agents/code-implementer   # card + prompt.md (ACP preamble) + rubric.md
    provider: default
    memory:
      bucket: coding   # gate-side recall + answer-mined commit (vetting memoryRecall / memory.Commit)
    model: ${QUACK_CODER_MODEL}       # falls back to QUACK_RESEARCHER_MODEL if unset
    context_window: 65536
    judge_rounds: 8             # coding needs iterate-until-tests-pass; the judge+revise grind is where quack converges on correct code (tunable)
    # External ACP coder (internal/acp): opencode drives the model above via
    # OPENCODE_CONFIG_CONTENT; git push is denied in the subprocess (delivery is
    # gate-owned) and the gate reads commits off the clone (augmentFromRepo).
    acp:
      command: ["opencode", "acp"]
  code-reviewer:
    bundle: agents/code-reviewer      # card + prompt.md (values + VERDICT/FINDINGS contract) + rubric.md
    provider: default
    memory:
      bucket: coding   # gate-side recall + answer-mined commit (vetting memoryRecall / memory.Commit)
    model: ${QUACK_CODER_MODEL}       # reuse the coder model (falls back to QUACK_RESEARCHER_MODEL if unset)
    context_window: 65536
    judge_rounds: 2             # a review is largely one-pass; 2 rounds is plenty
    # External ACP reviewer, read_only: runs the change with its own tools, never
    # commits; the gate parses its VERDICT/FINDINGS tail into the posted review.
    acp:
      command: ["opencode", "acp"]
      read_only: true
  code-explorer:
    bundle: agents/code-explorer      # card + prompt.md (read-only exploration) + rubric.md
    provider: default
    memory:
      bucket: coding   # gate-side recall + answer-mined commit (vetting memoryRecall / memory.Commit)
    model: ${QUACK_CODER_MODEL}       # reuse the coder model (falls back to QUACK_RESEARCHER_MODEL if unset)
    context_window: 65536
    judge_rounds: 2             # exploration is largely one-pass; 2 rounds is plenty
    acp:
      command: ["opencode", "acp"]
      read_only: true
      allow_clone: true   # reads third-party repos by cloning into $TMPDIR; git push stays denied
  synthesizer:
    bundle: agents/synthesizer
    skills: [format-markdown, present-coding-plan]
    provider: default
    model: ${QUACK_RESEARCHER_MODEL}
    context_window: 65536
    judge_rounds: 1             # just combines already-vetted upstream node outputs; re-revising is low value
    tools: []

tools:
  web_search:
    kind: exa            # keyless via Exa's hosted MCP - no container, no API key
  web_fetch:
    kind: direct         # plain SSRF-guarded GET - no render backend needed

gates:
  rubric_path: config/rubric.md
  deterministic_checks:
    max_rounds: 1
  judge:
    provider: default
    model: ${QUACK_JUDGE_MODEL}
    max_rounds: 1
    threshold: 0.6

dag:
  max_active_runs: 3    # orchestrator RUNS concurrent server-wide; a burst queues (1-GPU: lower it)
  max_active_nodes: 2

server:
  addr: ":8080"
  topology: managed       # quack server brings up the stores + tears them down

# Workspace defaults on (root ./workspace, default caps). check_commands is
# unset ⇒ the default allowlist applies (go/npm/make - see internal/config
# defaultCheckCommands); each derived check is gated on its binary existing on
# the host, so a machine without the toolchain derives nothing. git_credentials
# empty ⇒ public repos only (keyless path). No guard-ladder entries by default:
# the code agents run as external ACP subprocesses (no quack write tools left to
# guard); workspace.guards still accepts entries for any remaining tool.
#
# sandbox: bwrap is the DEFAULT and it matters most in exactly this preset -
# `quack server` here runs on the operator's own machine, as their own user, so
# an unsandboxed child process would have their ~/.ssh, ~/.aws and .env. Install
# bubblewrap (Debian/Ubuntu: apt-get install bubblewrap) or the server refuses to
# start; `sandbox: none` opts out, loudly.
workspace:
  root: ${QUACK_WORKSPACE_ROOT}
  sandbox: bwrap

# GitHub App extension: webhook receiver + App-authed git creds + the App-mention
# trigger. Uncomment and set the env vars to enable it on this deployment. Uses the
# App CLIENT ID as the JWT issuer (the App's CLIENT SECRET is unused - that's OAuth
# only) and the private key inline as PEM contents via env (private_key_path is the
# alternative for a mounted .pem file). Secrets MUST be ${VAR} refs - a literal is a
# startup error.
#
# Kept COMMENTED (not active): the block is validated at load, and a present-but-
# empty section (env vars unset) is a boot error - it requires an issuer, a private
# key, and a webhook_secret. So an operator uncomments it only once those env vars
# are actually set, rather than shipping a config that fails to boot without them.
# extensions:
#   github:
#     client_id: ${QUACK_GITHUB_APP_CLIENT_ID}
#     private_key: ${QUACK_GITHUB_APP_PRIVATE_KEY}    # PEM contents via env
#     # private_key_path: /run/secrets/quack-app.pem  # alternative: a mounted .pem
#     webhook_secret: ${QUACK_GITHUB_APP_WEBHOOK_SECRET}
#     mention: "@quack"
#     # allowed_users: GitHub logins permitted to invoke quack via a mention
#     # comment or a human-applied workflow label (case-insensitive). Empty
#     # (default) DENIES every human-invoked trigger - auto-review is
#     # unaffected. Seed it with your own login(s) or quack won't respond.
#     allowed_users: [fagerbergj]
#     # triggers: which webhook events fire a run. Default [mention]. Others:
#     # pr_opened (auto-review on PR open), label (review a PR when labels.review
#     # is applied), issue_plan (plan an issue when labels.plan is applied),
#     # issue_implement (implement the plan when labels.implement is applied),
#     # merge (squash-merge a PR when labels.merge is applied by a human AND
#     # quack's own latest review is APPROVED - needs pull request write incl. merge).
#     # triggers: [mention, pr_opened, label, issue_plan, issue_implement, merge]
#     # labels: the repo labels driving the label-based workflow (applying a label
#     # needs repo write access, so labels double as the permission model).
#     # labels:
#     #   plan: "quack:plan"
#     #   implement: "quack:implement"
#     #   review: "quack-auto-review"
#     #   merge: "quack:merge"
