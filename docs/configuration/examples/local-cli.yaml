# Fully local, no containers. sqlite session store, no qdrant (memory stays
# disabled), keyless web tools, no coding agents. This is close to what
# `quack init` writes when you pick "Local" and leave the optional features
# and coding agents off - see ../deployment.md and ../../cli.md.
#
# Run it:
#   QUACK_LLM_ENDPOINT=http://localhost:11436/v1 \
#     ./quack server run --config docs/configuration/examples/local-cli.yaml

providers:
  default:
    kind: openai
    endpoint: ${QUACK_LLM_ENDPOINT}   # e.g. http://localhost:11436/v1 (llama-swap/Ollama/vLLM), or a hosted API
    api_key: ${QUACK_LLM_API_KEY}     # blank if the endpoint needs none

# models: the registry every model reference must resolve into. Model names
# are hardcoded below (not ${VAR}) so this file runs with only the endpoint set.
models:
  qwen3.8-27b:            # worker: orchestrator + web-researcher/synthesizer
    provider: default
    role: worker
  gemma4-26b-a4b:         # judge: gates.judge
    provider: default
    role: judge

stores:
  default_sqlite:
    kind: sqlite
    url: ./quack.db

session:
  store: default_sqlite

orchestrator:
  skills: [plan-work, format-markdown, present-coding-plan, contribute]
  provider: default
  model: qwen3.8-27b

agents:
  web-researcher:
    bundle: agents/web-researcher
    skills: [format-markdown, research-git-repos]
    provider: default
    model: qwen3.8-27b
    context_window: 65536
    judge_rounds: 1
    tools: [web_search, web_fetch, summarize, current_date, ask_user]
  synthesizer:
    bundle: agents/synthesizer
    skills: [format-markdown]
    provider: default
    model: qwen3.8-27b
    context_window: 65536
    judge_rounds: 1
    tools: []

tools:
  web_search:
    kind: exa   # keyless via Exa's hosted MCP; add auth.api_key for the sturdier REST path
  web_fetch:
    kind: direct   # plain GET, no render service - no crawl4ai container needed

gates:
  constitution_path: config/constitution.md
  rubric_path: config/rubric.md
  deterministic_checks:
    max_rounds: 4
  judge:
    provider: default
    model: gemma4-26b-a4b
    max_rounds: 1
    threshold: 0.7
    max_iterations: 6
    context_window: 65536

dag:
  max_active_nodes: 32  # PER-RUN host-resource ceiling only; GPU concurrency is models/providers limits (#1007)

server:
  addr: ":8080"
  topology: embedded   # sqlite, no containers - the whole point of this shape
