# Egress proxy for session containers (docs/README.md, "Session containers"): sessions sit on an internal network, and this is their only way out.
# Any public host on 80/443 passes: the researcher's web_fetch reads arbitrary pages and the implementer installs any repo's dependencies.
http_port 3128

# Matched against the addresses squid resolves and connects to, so a public name that points at a private host is refused too.
acl not_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/3
acl not_public dst ::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny not_public
http_access deny to_localhost
http_access allow all

# A forwarder, not a cache, and the session's address is not passed upstream.
cache deny all
forwarded_for delete
via off
pid_filename none
shutdown_lifetime 1 seconds
