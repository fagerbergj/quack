# Langfuse OpenAPI spec (../openapi.yml) fetched from
# http://jason-server:3008/generated/api/openapi.yml on 2026-09-16, Langfuse version 4.36.0.
#
# oapi-codegen config: client-only code for the dataset endpoints the
# hand-written prompt client (../client.go) doesn't cover - kept in a
# sub-package to avoid colliding with client.go's own Client/Prompt types.
# Prompts/Scores/ScoreConfigs are dropped: prompts are covered by client.go,
# and nothing in this repo reads/writes scores.
package: langfusegen
output: langfusegen/openapi.gen.go
generate:
  client: true
  models: true
output-options:
  include-tags:
    - Datasets
    - DatasetItems
    - DatasetRunItems
