# Spike: `pig piglet build tools/pi-acp/pig/quack.yaml --format binary --out pig-quack` fuses the gate into one
# Node-free binary; the shim drives it via PI_ACP_PI_CMD (PIG reads PIG_CODING_AGENT_DIR, not PI_CODING_AGENT_DIR).
name: quack-agent
description: "quack ACP coding agent engine: PIG with the quackgate policy gate and MCP bridge fused in"
# pi's default tool set; a Piglet without `tools` also offers powershell, grep, find and ls.
tools: [read, bash, edit, write]
# Run with --no-extensions: `discovery: extensions: []` still loads the shim's quackmcp.ts (needs Node), and
# built-in extensions add codemode/tool_search to the model's tools. The fused gate survives the flag.
extensions:
  - name: quackgate
    origins: [local:./quackgate]
build:
  targets: [linux/amd64]
  outputName: pig-quack
  extensionRealization: fused
