scale:
  min: 0
  max: 3
  pass: 2
criteria:
  cites_sources:
    definition: >
      Every significant claim carries an inline citation to the source that backs it, in whichever form
      the upstream research used: a web URL as an inline Markdown link, or a repo-relative code citation
      (<repo>@path/to/file.go, optionally :start-end, or [label](path/to/file.go#L42)). Source names alone
      do not count - a name cannot be followed, only a link or a path can.
    guidance: >
      The synthesizer doesn't create sources - it preserves the citations the research it received already
      carried. Which form applies depends on what the upstream research was: code exploration cites code,
      web research cites URLs, and a synthesis of both carries both. Do not expect a URL from research
      that never touched the web, and do not privilege one form over the other - check whether each claim
      has an inline citation in either form, not which regime the run belongs to.

      This criterion is fully computed by deterministic code from what the research session actually fetched/searched
      - it checks EXISTENCE and resolution of the citation, not its quality. `citation_quality` below
      is the judge-scored companion that covers reputability, accuracy, and placement.
    steps:
    - Count the answer's non-trivial factual claims.
    - >-
      For each, check whether it carries an inline citation - a followable URL or a repo-relative code
      reference - next to the claim, not deferred to a Sources block.
    - >-
      A Sources/References block does not, by itself, back a claim it isn't attached to - a placeholder
      or unlinked entry there does not rescue an uncited claim.
    - Score the proportion of claims that carry an inline citation in either form.
    bands:
    - min: 0.75
      max: 1.0
      meaning: fetched or seen in search - backed
    - min: 0.25
      max: 0.74
      meaning: same host seen but this exact page never fetched - likely invented
    - min: 0.0
      max: 0.24
      meaning: never seen anywhere - fabricated
    deterministic: true
    fix: >
      Fetch each source, or remove the citation and any claim resting on it.
    scale:
      min: 0
      max: 1
      pass: 0.85
  citation_quality:
    definition: >
      Cited sources are reputable for the claim they back, cited accurately (the source actually says
      what the claim attributes to it), and placed at the claim they support rather than deferred to an
      unrelated list. `cites_sources` above is a deterministic existence check; this criterion is the
      judge's own read on quality and placement, and does not re-derive existence.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a cited claim whose citation is not in the claim's sentence or the one before it, whose named outlet
      differs from the linked URL's host, or whose quoted words do not appear in that source's text shown
      in the session. Record each finding with a verbatim quote (or an omission naming exactly what is
      missing); one you cannot quote or name does not count. Pick the band from the number of findings;
      none is the top band.
    - List every cited claim.
    - >-
      For each, check the citation sits in the claim's sentence or the one before it, not only in a references
      block.
    - For each, check the outlet named in the text matches the host of the linked URL.
    - >-
      For each quoted passage, check the words appear in that source's text as shown in the session; if
      the session shows no text for that source, it is not a finding. A cited page that was never fetched
      is scored by code under `cites_sources` and is not a finding here. A weak or tangential source is
      a note, not a finding.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is a placement finding: the citation exists elsewhere in the answer
        but not at the claim.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a named outlet that does not match the linked page,
        or quoted words the session's source text does not contain.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or a quote is contradicted by the session's source text, or citations exist
        only in a references block with none at claims.
    anchors:
    - quote
    - omission
    guidance: >
      Three checkable questions per cited claim: placement, outlet-host match, and quoted words present
      in the shown source text. Existence of the fetch is `cites_sources` (code); presence of a citation
      at all is `grounded`.
  clean_output:
    definition: >
      The response is formatted for the reader it is addressed to: it begins directly with the answer
      content (title or first sentence) and ends with the answer or its Sources block - no preamble, no
      process narration, no meta-commentary about skills or formatting rules.
    guidance: >
      This includes mid-body deliberation: visible self-correction ("Actually, let me reconsider…"), an
      abandoned or superseded draft left in place, or the same conclusion - a snippet, a list, a decision
      - written out more than once on the way to a final version.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a sentence or block that is not the answer: preamble, process narration, self-talk, meta-commentary
      about skills or formatting, leaked reasoning, or a duplicated/superseded draft left in place. Record
      each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot
      quote or name does not count. Pick the band from the number of findings; none is the top band.
    - >-
      Read the first sentence: direct answer content, or a preamble ("Let me compile…", "Based on the
      research…")?
    - Scan the body and tail for leaked planning, self-talk, or meta-commentary.
    - >-
      Check whether any snippet, list, or conclusion appears more than once in different (superseded)
      forms - a sign of an abandoned draft left in place.
    - Check the structure (headings, lists, Sources block) matches what the content actually needs.
    bands:
    - min: 3.0
      max: 3.0
      meaning: >-
        no finding: the answer begins and ends with the answer, and only the final version of any content
        appears.
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is one stray sentence (an opener or a meta remark) with the
        rest clean.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a paragraph of narration or reasoning, or a duplicated
        section.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or the answer opens with a preamble or planning, or a duplicated/superseded
        draft sits beside the final one.
    anchors:
    - quote
    - omission
  complete_synthesis:
    definition: >
      The answer addresses every distinct part of the original question, drawing on all relevant research
      provided. No research output is silently ignored.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a distinct part of the question, or a research thread the synthesizer received, that the answer
      does not cover. Record each finding with a verbatim quote (or an omission naming exactly what is
      missing); one you cannot quote or name does not count. Pick the band from the number of findings;
      none is the top band.
    - Identify the original question's distinct parts or sub-questions.
    - Check whether each part is addressed in the synthesized answer.
    - Note any research angle that was visibly omitted or undercovered.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and the part is covered, only more thinly than the rest.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that is a sub-question or research thread left out.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or a core part of the question is missing, or a major research output is
        ignored.
    anchors:
    - quote
    - omission
  grounded:
    definition: >
      The synthesizer must not introduce information not present in the research provided to it. Every
      specific (name, number, claim, URL) must trace back to the research it received - not to training-data
      knowledge.
    guidance: >
      Two checkable questions per specific: does the answer contradict it, and (when uncited) is it in
      the received research. Do **NOT** flag a specific because it is unfamiliar or postdates your training.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a specific (name, number, price, date, quote) that another passage of the answer contradicts, or
      that appears nowhere in the research the synthesizer received. Record each finding with a verbatim
      quote (or an omission naming exactly what is missing); one you cannot quote or name does not count.
      Pick the band from the number of findings; none is the top band.
    - List every specific that appears more than once, or that a later passage restates or derives from.
    - For each, check the passages agree; quote both when they do not.
    - >-
      For a specific with no citation, check it appears in the research inputs; quote the specific when
      it does not. Whether a specific has a citation next to it is scored by code as `specifics_cited`
      and is not a finding here.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is a secondary detail, not a headline figure or a conclusion.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that is a headline figure or a conclusion.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or the main conclusion rests on a specific the answer itself contradicts
        or the research never contained.
    anchors:
    - quote
    - omission
  specifics_cited:
    definition: >
      Substantive specifics (figures, percentages, prices, dates) carry a citation in their own sentence
      or block, or appear in the research the node received.
    guidance: >
      Code-owned: computed over the answer plus every artifact the worker wrote this round, so a pointer
      answer is scored on its artifact. Absent when the deliverable has fewer than 10 substantive specifics.
      The judge does not score this criterion.
    bands:
    - min: 0.8
      max: 1.0
      meaning: nearly every figure sits next to its source or came from the received research
    - min: 0.6
      max: 0.79
      meaning: a run of figures with no source near them
    - min: 0.0
      max: 0.59
      meaning: most figures have no source near them
    deterministic: true
    fix: >
      Put the citation in the same sentence or bullet as each figure it backs; drop figures you cannot
      source.
    scale:
      min: 0
      max: 1
      pass: 0.8
