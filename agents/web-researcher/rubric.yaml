scale:
  min: 0
  max: 3
  pass: 2
notes: >
  Date-awareness: the agent has a `current_date` tool and is expected to call it before researching time-sensitive
  topics. If the answer references events or data that are clearly from the wrong year (e.g., searches
  framed around a year that has already passed), treat this as a `grounded` failure - the retrieval was
  mis-scoped.

  Zero-retrieval handling: if the agent explicitly states it could not retrieve sources (all fetches errored,
  bot-walls blocked every URL, no search results), score `grounded` and `cites_sources` at 0 but grade
  `answers_question` and `internally_consistent` on the honesty and completeness of the disclosure itself,
  not on the absent content. If the agent synthesised silently despite failed retrieval, score `grounded`
  at 0 as a hard failure.
criteria:
  answers_question:
    definition: >
      The response addresses exactly what the user asked, in full - not a related-but-different question,
      and not a partial answer that drops part of the request.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a distinct ask or constraint in the request that the answer does not address. Record each finding
      with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name
      does not count. Pick the band from the number of findings; none is the top band.
    - >-
      Decompose the user's question into its distinct asks (including constraints like location, timeframe,
      budget, audience).
    - Check that each ask is addressed in the answer.
    - Note any silent narrowing or topic drift.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and the ask is addressed, only more thinly than the others.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that drops or silently narrows an ask or constraint.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the core ask is missed, or the answer addresses a different question.
    anchors:
    - quote
    - omission
  cites_sources:
    definition: >
      Claims carry followable links: attach inline URLs to non-trivial claims, not just named sources
      ("According to TechCrunch...") - a name cannot be checked but a link can.
    guidance: >
      This criterion is fully computed by deterministic code from what the research session actually fetched/searched
      - it checks EXISTENCE and resolution of the citation, not its quality. `citation_quality` below
      is the judge-scored companion that covers reputability, accuracy, and placement.
    steps:
    - Count the answer's non-trivial claims.
    - Count how many carry an inline, followable URL (not just a source name).
    - Score the proportion that are linked.
    bands:
    - min: 0.75
      max: 1.0
      meaning: fetched or seen in search - backed
    - min: 0.25
      max: 0.74
      meaning: same host seen but this exact page never fetched - likely invented
    - min: 0.0
      max: 0.24
      meaning: never seen anywhere - fabricated
    deterministic: true
    fix: >
      Fetch each source, or remove the citation and any claim resting on it.
    scale:
      min: 0
      max: 1
      pass: 0.85
  citation_quality:
    definition: >
      Cited sources are reputable for the claim they back, cited accurately (the source actually says
      what the claim attributes to it), and placed at the claim they support rather than deferred to an
      unrelated list. `cites_sources` above is a deterministic existence check; this criterion is the
      judge's own read on quality and placement, and does not re-derive existence.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a cited claim whose citation is not in the claim's sentence or the one before it, whose named outlet
      differs from the linked URL's host, or whose quoted words do not appear in that source's text shown
      in the session. Record each finding with a verbatim quote (or an omission naming exactly what is
      missing); one you cannot quote or name does not count. Pick the band from the number of findings;
      none is the top band.
    - List every cited claim.
    - >-
      For each, check the citation sits in the claim's sentence or the one before it, not only in a references
      block.
    - For each, check the outlet named in the text matches the host of the linked URL.
    - >-
      For each quoted passage, check the words appear in that source's text as shown in the session; if
      the session shows no text for that source, it is not a finding. A cited page that was never fetched
      is scored by code under `cites_sources` and is not a finding here. A weak or tangential source is
      a note, not a finding.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is a placement finding: the citation exists elsewhere in the answer
        but not at the claim.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a named outlet that does not match the linked page,
        or quoted words the session's source text does not contain.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or a quote is contradicted by the session's source text, or citations exist
        only in a references block with none at claims.
    anchors:
    - quote
    - omission
    guidance: >
      Three checkable questions per cited claim: placement, outlet-host match, and quoted words present
      in the shown source text. Existence of the fetch is `cites_sources` (code); presence of a citation
      at all is `grounded`.
  clean_output:
    definition: >
      The response is formatted for the reader it is addressed to: it begins directly with the answer
      (its title or first sentence) and ends with the answer (or its `Sources` section).
    guidance: >
      No preamble, no process narration, no planning or self-talk, no meta-commentary about formatting/skills/rules,
      and no leftover reasoning. This includes mid-body deliberation: visible self-correction ("Actually,
      let me reconsider…"), an abandoned or superseded draft left in place, or the same conclusion - a
      snippet, a list, a decision - written out more than once on the way to a final version. The reader
      sees the reply verbatim, so anything like "Let me…", "I see, I made a typo…", "Actually, wait…",
      "the skill says…", or trailing drafting notes is a defect - even when the buried content is excellent.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a sentence or block that is not the answer: preamble, process narration, self-talk, meta-commentary
      about skills or formatting, leaked reasoning, or a duplicated/superseded draft left in place. Record
      each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot
      quote or name does not count. Pick the band from the number of findings; none is the top band.
    - 'Read the first sentence: does the answer begin directly, or with a preamble / process narration?'
    - Scan the body and tail for leaked planning, self-talk, or meta-commentary.
    - >-
      Check whether any snippet, list, or conclusion appears more than once in different (superseded)
      forms - a sign of an abandoned draft left in place.
    - >-
      Check the structure (headings, lists, Sources block) matches what the content actually needs; the
      buried answer's quality does not excuse an intrusion.
    bands:
    - min: 3.0
      max: 3.0
      meaning: >-
        no finding: the answer begins and ends with the answer, and only the final version of any content
        appears.
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is one stray sentence (an opener or a meta remark) with the
        rest clean.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a paragraph of narration or reasoning, or a duplicated
        section.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or the answer opens with a preamble or planning, or a duplicated/superseded
        draft sits beside the final one.
    anchors:
    - quote
    - omission
  grounded:
    definition: >
      Every non-trivial factual claim traces to a URL, page, or search result the agent actually fetched
      this session - general knowledge or prior training does not count as retrieved - and nothing reads
      as invented: every specific (name, price, address, rating, date, statistic, quote) is stated with
      confidence the answer's own evidence supports.
    guidance: >
      One checkable question per specific: does the answer contradict it elsewhere. Citation presence
      is code-owned (`specifics_cited`); do **NOT** lower this score because a cited fact is unfamiliar,
      recent, or absent from your own knowledge.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a specific (name, number, price, date, quote) that another passage of the answer contradicts. Record
      each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot
      quote or name does not count. Pick the band from the number of findings; none is the top band.
    - List every specific that appears more than once, or that a later passage restates or derives from.
    - >-
      For each, check the passages agree; quote both when they do not. Whether a specific has a citation
      is scored by code as `specifics_cited`; whether the cited page was fetched is `cites_sources`. Neither
      is a finding here.
    - >-
      If the agent states `web_fetch` failed for most/all sources, check whether it said so plainly. An
      honest disclosure of failed retrieval caps this criterion at **1** (not lower); silent synthesis
      despite failed fetches scores **0**.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is a secondary detail, not a headline figure or a conclusion.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that is a headline figure or a conclusion.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the main conclusion rests on a specific the answer itself contradicts.
    anchors:
    - quote
    - omission
  specifics_cited:
    definition: >
      Substantive specifics (figures, percentages, prices, dates) carry a citation in their own sentence
      or block, or appear in the research the node received.
    guidance: >
      Code-owned: computed over the answer plus every artifact the worker wrote this round, so a pointer
      answer is scored on its artifact. Absent when the deliverable has fewer than 10 substantive specifics.
      The judge does not score this criterion.
    bands:
    - min: 0.8
      max: 1.0
      meaning: nearly every figure sits next to its source or came from the received research
    - min: 0.6
      max: 0.79
      meaning: a run of figures with no source near them
    - min: 0.0
      max: 0.59
      meaning: most figures have no source near them
    deterministic: true
    fix: >
      Put the citation in the same sentence or bullet as each figure it backs; drop figures you cannot
      source.
    scale:
      min: 0
      max: 1
      pass: 0.8
  internally_consistent:
    definition: >
      The answer does not contradict itself, and its conclusions follow from the evidence it presents.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      two passages of the answer that cannot both be true, or a conclusion sentence whose supporting evidence
      appears nowhere in the answer. Record each finding with a verbatim quote (or an omission naming
      exactly what is missing); one you cannot quote or name does not count. Pick the band from the number
      of findings; none is the top band.
    - List every conclusion sentence and every pair of passages about the same fact.
    - For each pair, check both can be true at once; quote both when they cannot.
    - >-
      For each conclusion, find the sentence in the answer that supports it; an unsupported conclusion
      is a finding. A hedge phrased unevenly is not a finding unless the two phrasings cannot both be
      true.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is a conclusion stated one notch more firmly than its evidence, with
        no contradiction.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that is two passages that cannot both be true.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the main conclusion contradicts the answer's own evidence.
    anchors:
    - quote
    - omission
