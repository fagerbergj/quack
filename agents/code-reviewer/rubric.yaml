scale:
  min: 0
  max: 2
  pass: 2
criteria:
  catches_real_issues:
    definition: >
      The review surfaces the change's actual defects - the correctness, security, and missing-test problems that matter - rather than only cosmetic ones, and presents them as findings for a human deciding whether to merge, not a transcript of the reviewer's own process. It never turns an environment-specific failure into a code-quality concern. Judge against what the change actually contains, not against an imagined ideal review.
    steps:
    - From the diff, identify the genuine problems in the change (bugs, unhandled edge cases, security exposure, new behavior with no test).
    - Check whether the review found each, or missed a significant one while spending its attention on trivia.
    - Check the visible body (outside any collapsed `<details>` block) for process narration - a "What I ran"/"What I checked" list of commands (`git diff`, `go test`, `gofmt`, `go vet`, install steps) presented as review content rather than tucked away for debugging.
    - "Check every reported test/build failure or \"pre-existing issue\": is it tied to the diff, or is it a sandbox/toolchain/network gap (missing `make`, no network, stale cache) that the PR's own green CI contradicts? A failure that doesn't reproduce in CI and isn't caused by the diff is not a legitimate finding."
    bands:
    - min: 2.0
      max: 2.0
      meaning: the review catches the change's real, impactful issues (or correctly finds few, because the change is clean), the body is findings and verdict only, and no environmental-only failure is reported as a concern.
    - min: 1.0
      max: 1.0
      meaning: it catches some but misses one material issue or buries it among minor points, or a process-narration section precedes the findings, or one reported failure is questionable but not clearly environmental.
    - min: 0.0
      max: 0.0
      meaning: it misses the change's central defect, reports only cosmetic findings while a real bug/security/test gap goes unmentioned, leads with "what I ran" as its substance, or reports a sandbox/environment failure as a code concern on a PR whose CI is green.
    anchors:
    - quote
    - omission
  claims_grounded:
    definition: >
      Every finding the review makes is grounded in code the reviewer actually read - it points at a real file/line/behavior, not an invented defect.
    guidance: >
      This is the fabrication check for a review: asserting "this function swallows the error" about code the reviewer never opened is as disqualifying as an invented citation.
    steps:
    - List the review's substantive findings (each blocking issue, suggestion, and factual claim about the code's behavior).
    - "For each, check it against the ledger's read/diff samples and, if you can, the file itself: does the cited code actually behave the way the finding says?"
    - A finding about code contradicted by the file, or asserting behavior in a file the reviewer never read, is fabrication - score 0.
    bands:
    - min: 2.0
      max: 2.0
      meaning: every substantive finding points at code the reviewer actually read, and matches what that code does.
    - min: 1.0
      max: 1.0
      meaning: one finding rests on an assumption not checked against the file, though nothing it says is actually contradicted by the code.
    - min: 0.0
      max: 0.0
      meaning: a finding is contradicted by the file it cites, or asserts behavior in a file the reviewer never read.
    anchors:
    - quote
    - omission
  constructive_actionable:
    definition: >
      Each finding explains the underlying *why* (risk, principle, or benefit) rather than only asserting "this is wrong", so it's actionable. A finding that proposes a SPECIFIC code change (a rename, an extraction, a different implementation) shows that code in a fenced block with a language tag rather than only describing it in prose. A PURELY OBSERVATIONAL finding - a question, a naming nit with no proposed name - proposes nothing concrete and needs no code block.
    steps:
    - Check findings explain the underlying reason (risk/principle/benefit), not only "this is wrong".
    - For each finding that proposes a specific code change, check whether it supplies that code in a fenced code block, rather than only describing the change in prose.
    bands:
    - min: 2.0
      max: 2.0
      meaning: every finding explains its why, and every finding proposing specific code supplies it in a fenced block.
    - min: 1.0
      max: 1.0
      meaning: actionable but terse (some findings state what without why), or a finding proposes a specific change in prose without the code to back it.
    - min: 0.0
      max: 0.0
      meaning: findings are unactionable ("this is bad") with no reasoning at all.
    anchors:
    - quote
    - omission
  severity_grounded:
    definition: >
      Every severity label rests on something objective, and the review says what. A finding supported only by the reviewer's preference is a nit:, however strongly it is argued. blocking: requires one of five anchors: defect (concrete inputs or state produce wrong output, a crash, or data loss), security, design (a NAMED principle violated, not "I'd have done it differently"), scope (the change does what its task never asked for), or tests (new behaviour with no test, or a test that passes while what it claims to cover is broken).
    guidance: >
      Score whether each label is supported, not whether you would have chosen it. Two reviewers can reasonably weigh the same finding differently; neither may block on taste. The style guide and the linter are the authority on style, and out-of-scope observations belong in their own issue rather than gating this change.
    steps:
    - For each `blocking:` finding, name which of the five anchors it claims, then open the code and check the anchor actually holds. An anchor asserted but not borne out by the code means the label is wrong, however serious the finding sounds.
    - For each `suggestion:`/`nit:`, check it is not one of the five mislabelled downward. A defect soft-pedalled into a suggestion is the more damaging error, because it ships.
    - "Check nothing gates the merge on preference: is any `blocking:` finding one the author could reasonably decline at no objective cost?"
    bands:
    - min: 2.0
      max: 2.0
      meaning: every label carries a supported anchor; nothing blocks on taste.
    - min: 1.0
      max: 1.0
      meaning: one label unsupported, or one defect soft-pedalled below `blocking:`, or one preference treated as blocking.
    - min: 0.0
      max: 0.0
      meaning: labels are preference-driven, or a defect/security finding is labelled below `blocking:` while style gates the merge.
    anchors:
    - quote
    - omission
  structured_verdict:
    definition: >
      The review's summary is scannable and consistent with its own findings and verdict - a fifteen-second takeaway a human can act on, not a mechanical check that a structured field matches the prose. Findings are grouped by severity (blocking → suggestions → nits), and the staged verdict (via `stage_review`'s `event`, or the answer's `VERDICT:` tail) tells the same story as the findings' own severity labels.
    guidance: >
      The verdict is STRUCTURED DATA: your prompt surfaces the resolved value as "Staged review verdict: <event>" when one is staged. Three verdicts, three levels of confidence: any surviving `blocking:` ⇒ `request_changes`; else any unresolved `question:` ⇒ `comment`; else ⇒ `approve`, nits and suggestions okay. `comment` is legitimate ONLY when an unresolved `question:` stands, or the review states verification it could not finish - not as a way to avoid committing to a verdict with nothing unresolved behind it.
    steps:
    - Check the review opens with a high-level summary that a reader could act on in fifteen seconds, and groups findings by severity rather than scattering them.
    - Read the staged verdict provided to you and check it is present.
    - Cross-check every finding's OWN severity label against the overall verdict - the two must tell the same story. A finding labeled `blocking:` sitting alongside an `approve` verdict is a direct self-contradiction, regardless of whether the underlying issue actually warrants blocking; so is a `request_changes` verdict backed by nothing but `nit:`/`suggestion:` findings. Reason about it, do not pattern-match on the label text alone.
    bands:
    - min: 2.0
      max: 2.0
      meaning: clear, scannable summary, severity-grouped findings, a present and consistent staged verdict (including an explicit approve on a clean change).
    - min: 1.0
      max: 1.0
      meaning: mostly clear but missing the summary, or the staged verdict slightly mismatches the findings.
    - min: 0.0
      max: 0.0
      meaning: an unstructured wall of comments with no summary, no staged verdict at all, a staged verdict that contradicts the findings (approves over an unresolved blocking issue, or ANY finding is labeled blocking/security-severity while the verdict is `approve`, or `request_changes` is staged over findings that are all nits/suggestions), or a clean review - empty or non-blocking findings, verification the review calls complete - resolved to `comment` instead of `approve`.
    anchors:
    - quote
    - omission
  verification_over_assertion:
    definition: >
      The review verified the change's claims by reading - the diff, the code and tests it touches, CI's result - rather than trusting the description, and ran something only where a claim was too large or surprising for reading to settle.
    guidance: >
      Reading is the default, not a lesser substitute for running: a review that reads the tests, confirms they'd fail if the code were broken, and reads CI's result has fully verified. Running is warranted, not extra credit, only when the claim genuinely can't be settled by reading - a performance number, "this fixes the race", behaviour with no test. A rename, docs, comment, or config change is verified by reading alone; running one is not a bonus.
    steps:
    - Check whether the review engaged with the change's stated intent and confirmed the diff actually delivers it, by reading the code and tests rather than restating the description.
    - Check whether it read the tests closely enough to say whether they'd fail if the code were broken, and read CI's result rather than ignoring or re-deriving it.
    - Where the review ran something, check the claim actually warranted it and the review says so; running a docs/config/rename change, or running without saying why, is not rewarded here.
    bands:
    - min: 2.0
      max: 2.0
      meaning: the review reads the tests and CI closely enough to confirm the claim, and any run it did was warranted and stated as such.
    - min: 1.0
      max: 1.0
      meaning: it trusted the description on one axis (code or tests or CI) while verifying the others, or ran something the claim didn't warrant without harming the verdict.
    - min: 0.0
      max: 0.0
      meaning: "it trusted the description: accepted the claim, the tests' presence, or CI's result without reading closely enough to confirm any of them."
    anchors:
    - quote
