scale:
  min: 0
  max: 10
  pass: 7
criteria:
  claims_grounded:
    definition: 'Every finding the review makes is grounded in code the reviewer actually read

      - it points at a real file/line/behavior, not an invented defect. This is the

      fabrication check for a review: asserting "this function swallows the error"

      about code the reviewer never opened is as disqualifying as an invented

      citation.'
    steps:
    - List the review's substantive findings (each blocking issue, suggestion, and factual claim about
      the code's behavior).
    - 'For each, check it against the ledger''s read/diff samples and, if you can, the file itself: does
      the cited code actually behave the way the finding says?'
    - A finding about code contradicted by the file, or asserting behavior in a file the reviewer never
      read, is fabrication - score in the 0–2 band.
    bands: []
    anchors:
    - quote
    - omission
  catches_real_issues:
    definition: 'The review surfaces the change''s actual defects - the correctness, security,

      and missing-test problems that matter - rather than only cosmetic ones. Judge

      against what the change actually contains, not against an imagined ideal

      review.'
    steps:
    - From the diff, identify the genuine problems in the change (bugs, unhandled edge cases, security
      exposure, new behavior with no test).
    - Check whether the review found each, or missed a significant one while spending its attention on
      trivia.
    bands:
    - min: 7.0
      max: 10.0
      meaning: the review catches the change's real, impactful issues (or correctly finds few, because
        the change is clean).
    - min: 4.0
      max: 6.0
      meaning: it catches some but misses one material issue, or buries it among minor points.
    - min: 0.0
      max: 3.0
      meaning: it misses the change's central defect, or reports only cosmetic findings while a real bug/security/test
        gap goes unmentioned.
    anchors:
    - quote
    - omission
  severity_grounded:
    definition: 'Every severity label rests on something objective, and the review says what.

      A finding supported only by the reviewer''s preference is a `nit:`, however strongly it is argued.


      `blocking:` requires one of five anchors:

      **defect** (concrete inputs or state produce wrong output, a crash, or data loss),

      **security**,

      **design** (a NAMED principle violated, not "I''d have done it differently"),

      **scope** (the change does what its task never asked for),

      or **tests** (new behaviour with no test, or a test that passes while what it claims to cover is
      broken).


      Score whether each label is *supported*, not whether you would have chosen it.

      Two reviewers can reasonably weigh the same finding differently; neither may block on taste.

      The style guide and the linter are the authority on style, and out-of-scope observations belong
      in their own issue rather than gating this change.'
    steps:
    - For each `blocking:` finding, name which of the five anchors it claims, then open the code and check
      the anchor actually holds. An anchor asserted but not borne out by the code means the label is wrong,
      however serious the finding sounds.
    - For each `suggestion:`/`nit:`, check it is not one of the five mislabelled downward. A defect soft-pedalled
      into a suggestion is the more damaging error, because it ships.
    - 'Check nothing gates the merge on preference: is any `blocking:` finding one the author could reasonably
      decline at no objective cost?'
    bands:
    - min: 7.0
      max: 10.0
      meaning: every label carries a supported anchor; nothing blocks on taste.
    - min: 4.0
      max: 6.0
      meaning: one label unsupported, or one defect soft-pedalled below `blocking:`, or one preference
        treated as blocking.
    - min: 0.0
      max: 3.0
      meaning: labels are preference-driven, or a defect/security finding is labelled below `blocking:`
        while style gates the merge.
    anchors:
    - quote
    - omission
  constructive_actionable:
    definition: 'The review critiques the work, not the developer; explains the *why* behind

      each finding so it''s actionable. Language is plain and respectful - no

      sarcasm, hyperbole, or diminishing words. A finding that proposes a SPECIFIC

      code change is only actionable if it shows that code, not just describes it.

      A summary that also includes a sincere piece of praise is a polish signal,

      worth at most a point off if missing - it can never by itself pull this

      criterion below passing.'
    steps:
    - Check the tone targets the code, not the author, and avoids "just"/"always" /"obviously"-style diminishment.
    - Check findings explain the underlying reason (risk/principle/benefit), not only "this is wrong".
    - Note whether the summary - `stage_review`'s body, or the reply text ahead of the fallback `VERDICT:`/`FINDINGS:`
      tail - includes at least one genuine, sincere sentence of praise. There is no `praise:` label; the
      prompt reserves praise for the summary. Its absence is a minor deduction, never a disqualifier.
    - For each finding that proposes a specific code change (a rename, an extraction, a different implementation
      - anything more concrete than "this could be cleaner"), check whether it supplies that code in a
      fenced code block with a language tag, rather than only describing the change in prose. A PURELY
      OBSERVATIONAL finding - a question, a naming nit with no proposed name, "consider whether this handles
      X" - proposes nothing concrete and needs NO code block; do not penalize those for lacking one.
    bands:
    - min: 7.0
      max: 10.0
      meaning: respectful, every finding explains its why, and every finding proposing specific code supplies
        it in a fenced block. Missing praise costs at most one point here (e.g. 10 → 9), never more.
    - min: 4.0
      max: 6.0
      meaning: actionable but terse (some findings state what without why), or a finding proposes a specific
        change in prose without the code to back it.
    - min: 0.0
      max: 3.0
      meaning: comments target the person, are dismissive, or are unactionable ("this is bad") with no
        reasoning.
    anchors:
    - quote
    - omission
  verification_over_assertion:
    definition: 'The review verified the change''s claims rather than trusting them - it checked

      whether the code does what its description says and whether the tests would

      actually fail if the code were broken, instead of rubber-stamping.'
    steps:
    - Check whether the review engaged with the change's stated intent and confirmed the diff actually
      delivers it.
    - Check whether it assessed the tests' meaningfulness (do they exercise the new behavior / failure
      modes) rather than just noting tests exist.
    bands:
    - min: 7.0
      max: 10.0
      meaning: the review verifies the change's claims and interrogates the tests' substance.
    - min: 4.0
      max: 6.0
      meaning: it verifies the code but takes the tests at face value (or vice versa).
    - min: 0.0
      max: 3.0
      meaning: 'it rubber-stamps: accepts the description and the presence of tests without checking either.'
    anchors:
    - quote
    - omission
  structured_verdict:
    definition: 'The review is delivered in a usable shape - a summary (praise belongs only

      here), then findings grouped by severity (blocking → suggestions → nits) -

      and carries a clear, consistent verdict. The verdict is STRUCTURED DATA, not

      prose: the reviewer stages it via `stage_review`''s `event` (or the answer''s

      `VERDICT:` tail), and

      your prompt surfaces the resolved value as "Staged review verdict: <event>"

      when one is staged. Score presence and consistency of THAT, never whether the

      summary restates it in words - the reviewer is deliberately told the summary

      is a fifteen-second takeaway that does NOT repeat the verdict.'
    steps:
    - Check the review opens with a high-level summary and groups findings by severity rather than scattering
      them.
    - 'Read the staged verdict provided to you and check it is present and consistent with the findings.
      Three verdicts, three levels of confidence: any surviving `blocking:` ⇒ `request_changes`; else
      any unresolved `question:` ⇒ `comment`; else ⇒ `approve`, nits and suggestions okay.'
    - '`comment` is legitimate ONLY when an unresolved `question:` stands, or the review states verification
      it could not finish. A question withholds approval without demanding a change - the reviewer works
      from a bounded context, so not understanding something is at least as likely to mean it is missing
      a file as it is to mean the code is wrong. What fails here is a bare `comment` used to avoid committing
      to a verdict with nothing unresolved behind it, or no staged verdict at all. An empty or non-blocking
      findings list plus verification the review itself says it completed is a clean review regardless
      of framing - staging it as an "incremental note" on a re-review doesn''t earn the unfinished-verification
      exemption.'
    - Cross-check every finding's OWN severity label against the overall verdict - the two must tell the
      same story. A finding labeled `blocking:` (with or without a category tag like `blocking (security):`)
      sitting alongside an `approve` verdict is a direct self-contradiction, regardless of whether the
      underlying issue actually warrants blocking; so is a `request_changes` verdict backed by nothing
      but `nit:`/`suggestion:` findings. This is a coherence check on the review's OWN labels, not a re-review
      of the diff - reason about it, do not pattern-match on the label text alone.
    bands:
    - min: 7.0
      max: 10.0
      meaning: clear summary, severity-grouped findings, a present and consistent staged verdict (including
        an explicit approve on a clean change).
    - min: 4.0
      max: 6.0
      meaning: mostly structured but missing the summary, or the staged verdict slightly mismatches the
        findings.
    - min: 0.0
      max: 3.0
      meaning: an unstructured wall of comments with no summary, no staged verdict at all, a staged verdict
        that contradicts the findings (approves over an unresolved blocking issue, or ANY finding is labeled
        blocking/security-severity while the verdict is `approve`, or `request_changes` is staged over
        findings that are all nits/suggestions), or a clean review - empty or non-blocking findings, verification
        the review calls complete - resolved to `comment` instead of `approve`, including one staged as
        a re-review's "incremental note".
    anchors:
    - quote
    - omission
  signal_over_noise:
    definition: 'The review reads as findings for a human deciding whether to merge, not a

      transcript of the reviewer''s own process - and it never turns an

      environment-specific failure into a code-quality concern.'
    steps:
    - Check the visible body (outside any collapsed `<details>` block) for process narration - a "What
      I ran"/"What I checked" list of commands (`git diff`, `go test`, `gofmt`, `go vet`, install steps)
      presented as review content rather than tucked away for debugging.
    - 'Check every reported test/build failure or "pre-existing issue": is it tied to the diff, or is
      it a sandbox/toolchain/network gap (missing `make`, no network, stale cache) that the PR''s own
      green CI contradicts? A failure that doesn''t reproduce in CI and isn''t caused by the diff is not
      a legitimate finding.'
    bands:
    - min: 7.0
      max: 10.0
      meaning: the body is findings and verdict only (process notes, if any, are in a collapsed block),
        and no environmental-only failure is reported as a concern.
    - min: 4.0
      max: 6.0
      meaning: a process-narration section precedes the findings, or one reported failure is questionable
        but not clearly environmental.
    - min: 0.0
      max: 3.0
      meaning: the review leads with "what I ran" as its substance, or reports a sandbox/environment failure
        as a code concern on a PR whose CI is green.
    anchors:
    - quote
    - omission
