scale:
  min: 0
  max: 3
  pass: 2
notes: >
  No-text handling: if the image contains no legible text and the answer honestly states this (e.g. "No
  text is visible in this image"), do not penalise `completeness`. Score `completeness` on whether the
  disclosure is accurate and the description of what IS visible is reasonable. Score `answers_question`
  on whether the honest disclosure is an appropriate response to the request.
criteria:
  answers_question:
    definition: >
      The response addresses exactly what the user asked, in full - not a related-but-different question,
      and not a partial answer that drops part of the request.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a distinct ask or constraint in the request that the answer does not address. Record each finding
      with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name
      does not count. Pick the band from the number of findings; none is the top band.
    - >-
      Decompose the user's question into its distinct asks (e.g. "transcribe AND summarise AND list action
      items").
    - Check that each ask is addressed in the answer.
    - Note any silent narrowing or dropped sub-request.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and the ask is addressed, only more thinly than the others.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that drops or silently narrows an ask or constraint.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the core ask is missed, or the answer addresses a different question.
    anchors:
    - omission
  clean_output:
    definition: >
      The answer is formatted for the reader it is addressed to: scannable, and its structure matches
      its content. It begins directly and ends with the answer, with no preamble ("I can see…", "Let me
      analyse…"), no process narration, no meta-commentary about image quality or the agent's capabilities.
    guidance: >
      This includes mid-body deliberation: visible self-correction ("Actually, let me reconsider…"), an
      abandoned or superseded draft left in place, or the same conclusion written out more than once on
      the way to a final version.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a sentence or block that is not the answer: preamble, process narration, self-talk, meta-commentary
      about skills or formatting, leaked reasoning, or a superseded draft left in place. Record each finding
      with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name
      does not count. Pick the band from the number of findings; none is the top band.
    - 'Read the first sentence: does the answer begin directly, or with a preamble?'
    - Scan the body and tail for leaked planning, self-talk, or meta-commentary.
    - >-
      Check whether any snippet, list, or conclusion appears more than once in different (superseded)
      forms - a sign of an abandoned draft left in place.
    - Check the structure (headings, lists) matches what the content actually needs.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is one stray sentence (an opener or a meta remark) with the
        rest clean.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a paragraph of narration or reasoning, or a duplicated
        section.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or the answer opens with a preamble or planning, or a superseded draft
        sits beside the final one.
    anchors:
    - omission
  completeness:
    definition: >
      The answer captures all significant text and content in the image - it does not silently omit sections,
      labels, or passages.
    guidance: >
      This criterion is distinct from `grounded`: `grounded` asks whether stated claims are supported;
      `completeness` asks whether important content was missed.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a text region, label, or section the user asked for that the answer omits. Record each finding with
      a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name does
      not count. Pick the band from the number of findings; none is the top band.
    - Scan the image for distinct text regions, labels, and content sections.
    - Check whether each region is represented in the answer. Note any silently dropped section.
    - >-
      For dense images, check that small print and secondary labels are included where the user asked
      for full extraction.
    - >-
      Do not penalise for omitting content the user did not ask for (e.g., if the user asked only to transcribe
      a heading, body text can be omitted).
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is a secondary label or small print, present but thinner than
        the rest.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that is a section or label a thorough reader would
        include.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or large portions of the asked-for content are missing.
    anchors:
    - omission
  grounded:
    definition: >
      Every statement in the answer traces to something visibly present in the image, and no detail is
      invented from the model's training knowledge - no specific name, number, date, or quoted phrase
      stated confidently that is not present in the image. Over-inference - drawing conclusions the image
      does not support, even without fabricating a specific - fails this criterion too.
    guidance: >
      Two failure modes, one criterion: over-inference (a conclusion the image doesn't support) and commission
      (a specific added that was never there). Do **not** score a transcribed proper noun as hallucinated
      merely because you do not recognise it - a name or term unfamiliar to you may be exactly what the
      image contains. A specific is suspect only when the answer is internally inconsistent, or asserts
      a detail with no hedge in a context where it could not have been read from the image.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a non-trivial claim or specific (name, number, price, date, quote) with no inline citation, or one
      stated more confidently than the answer's own evidence supports. Record each finding with a verbatim
      quote (or an omission naming exactly what is missing); one you cannot quote or name does not count.
      Pick the band from the number of findings; none is the top band.
    - >-
      Inspect the image directly. Identify every claim in the answer (transcribed text, described objects,
      layout, relationships, named entities, numbers, quoted phrases).
    - >-
      For each, verify it against what is actually visible. Flag any claim that goes beyond what the image
      shows, infers a relationship the image does not establish, or is absent from/contradicts what you
      see.
    - >-
      Check whether genuinely illegible text is flagged or given as a best-guess (acceptable) versus confidently
      asserted as exact (not acceptable).
    - >-
      Pay attention to specifics that could plausibly be generated from training knowledge rather than
      read from the image - a person's name inferred from appearance, a date not visible, a brand not
      shown.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is a secondary detail (not a headline figure or a conclusion) and
        it is cited, only overstated.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a headline figure, a conclusion, or a specific with
        no citation at all.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or a name, number, or quote is contradicted by the answer's own evidence,
        or the majority of claims carry no citation.
    anchors:
    - omission
