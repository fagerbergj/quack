scale:
  min: 0
  max: 3
  pass: 2
notes: >
  No-text handling: if the image contains no legible text and the answer honestly states this (e.g. "No text is visible in this image"), do not penalise `completeness`. Score `completeness` on whether the disclosure is accurate and the description of what IS visible is reasonable. Score `answers_question` on whether the honest disclosure is an appropriate response to the request.
criteria:
  answers_question:
    definition: >
      The response addresses exactly what the user asked, in full - not a related-but-different question, and not a partial answer that drops part of the request.
    steps:
    - Decompose the user's question into its distinct asks (e.g. "transcribe AND summarise AND list action items").
    - Check that each ask is addressed in the answer.
    - Note any silent narrowing or dropped sub-request.
    bands:
    - min: 3.0
      max: 3.0
      meaning: addresses the request completely, including all sub-asks.
    - min: 2.0
      max: 2.0
      meaning: addresses every sub-ask, but one is covered more thinly than the others without actually being missed.
    - min: 1.0
      max: 1.0
      meaning: addresses the main ask but leaves a minor sub-request unanswered.
    - min: 0.0
      max: 0.0
      meaning: misses the core ask or redirects to something different.
    anchors:
    - omission
  clean_output:
    definition: >
      The answer is formatted for the reader it is addressed to: scannable, and its structure matches its content. It begins directly and ends with the answer, with no preamble ("I can see…", "Let me analyse…"), no process narration, no meta-commentary about image quality or the agent's capabilities.
    guidance: >
      This includes mid-body deliberation: visible self-correction ("Actually, let me reconsider…"), an abandoned or superseded draft left in place, or the same conclusion written out more than once on the way to a final version.
    steps:
    - "Read the first sentence: does the answer begin directly, or with a preamble?"
    - Scan the body and tail for leaked planning, self-talk, or meta-commentary.
    - Check whether any snippet, list, or conclusion appears more than once in different (superseded) forms - a sign of an abandoned draft left in place.
    - Check the structure (headings, lists) matches what the content actually needs.
    bands:
    - min: 3.0
      max: 3.0
      meaning: pure answer, well-structured for its content; no preamble, narration, or trailing reasoning; only the final version of any content appears.
    - min: 2.0
      max: 2.0
      meaning: a single stray opener, one meta sentence, or structure that doesn't quite fit the content, otherwise clean - one small blemish, not a pattern.
    - min: 1.0
      max: 1.0
      meaning: more than one such intrusion (several stray sentences, or structure that gets in the reader's way), though still short of a real preamble or leaked reasoning.
    - min: 0.0
      max: 0.0
      meaning: noticeable preamble, leaked planning/reasoning, or a duplicated/superseded draft left in the output.
    anchors:
    - omission
  completeness:
    definition: >
      The answer captures all significant text and content in the image - it does not silently omit sections, labels, or passages.
    guidance: >
      This criterion is distinct from `grounded`: `grounded` asks whether stated claims are supported; `completeness` asks whether important content was missed.
    steps:
    - Scan the image for distinct text regions, labels, and content sections.
    - Check whether each region is represented in the answer. Note any silently dropped section.
    - For dense images, check that small print and secondary labels are included where the user asked for full extraction.
    - Do not penalise for omitting content the user did not ask for (e.g., if the user asked only to transcribe a heading, body text can be omitted).
    bands:
    - min: 3.0
      max: 3.0
      meaning: all significant content the user asked for is present; minor incidental text may be omitted without penalty.
    - min: 2.0
      max: 2.0
      meaning: all significant content is present, but one secondary label or piece of small print is thinner than it could be without being dropped.
    - min: 1.0
      max: 1.0
      meaning: a section or label is missing that a thorough reader would include.
    - min: 0.0
      max: 0.0
      meaning: large portions of asked-for content are silently missing.
    anchors:
    - omission
  grounded:
    definition: >
      Every statement in the answer traces to something visibly present in the image, and no detail is invented from the model's training knowledge - no specific name, number, date, or quoted phrase stated confidently that is not present in the image. Over-inference - drawing conclusions the image does not support, even without fabricating a specific - fails this criterion too.
    guidance: >
      Two failure modes, one criterion: over-inference (a conclusion the image doesn't support) and commission (a specific added that was never there). Do **not** score a transcribed proper noun as hallucinated merely because you do not recognise it - a name or term unfamiliar to you may be exactly what the image contains. A specific is suspect only when the answer is internally inconsistent, or asserts a detail with no hedge in a context where it could not have been read from the image.
    steps:
    - Inspect the image directly. Identify every claim in the answer (transcribed text, described objects, layout, relationships, named entities, numbers, quoted phrases).
    - For each, verify it against what is actually visible. Flag any claim that goes beyond what the image shows, infers a relationship the image does not establish, or is absent from/contradicts what you see.
    - Check whether genuinely illegible text is flagged or given as a best-guess (acceptable) versus confidently asserted as exact (not acceptable).
    - Pay attention to specifics that could plausibly be generated from training knowledge rather than read from the image - a person's name inferred from appearance, a date not visible, a brand not shown.
    bands:
    - min: 3.0
      max: 3.0
      meaning: essentially every claim is traceable to the image; uncertain or unclear items are flagged or qualified; nothing reads as invented from training knowledge.
    - min: 2.0
      max: 2.0
      meaning: every claim is traceable, but one secondary detail is stated slightly more confidently than the image strictly supports, without contradicting it.
    - min: 1.0
      max: 1.0
      meaning: most claims are grounded, but a few specifics or inferences are asserted without hedging where the image was ambiguous, or minor secondary details look loosely inferred.
    - min: 0.0
      max: 0.0
      meaning: the answer draws conclusions or fills in details the image could not support, claims directly contradict what is visible, or a name/number/quoted phrase is clearly not from the image and stated as fact.
    anchors:
    - omission
