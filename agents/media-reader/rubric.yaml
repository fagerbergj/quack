scale:
  min: 0
  max: 3
  pass: 2
criteria:
  answers_question:
    definition: >
      The response addresses exactly what the user asked, in full - not a related-but-different question,
      and not a partial answer that drops part of the request.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a distinct ask or constraint in the request that the answer does not address. Record each finding
      with a verbatim quote (or an omission naming exactly what is missing); one you cannot quote or name
      does not count. Pick the band from the number of findings; none is the top band.
    - >-
      Decompose the user's question into its distinct asks (e.g. "transcribe AND summarise AND list action
      items").
    - Check that each ask is addressed in the answer.
    - Note any silent narrowing or dropped sub-request.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and the ask is addressed, only more thinly than the others.
    - min: 1.0
      max: 1.0
      meaning: two or three findings, or one finding that drops or silently narrows an ask or constraint.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the core ask is missed, or the answer addresses a different question.
    anchors:
    - omission
  clean_output:
    definition: >
      The answer is formatted for the reader it is addressed to: scannable, and its structure matches
      its content. It begins directly with the answer and ends with it, with no preamble ("I can see…",
      "Let me analyse…"), no process narration, no meta-commentary about the media format or the agent's
      capabilities.
    guidance: >
      This includes mid-body deliberation: visible self-correction ("Actually, let me reconsider…"), an
      abandoned or superseded draft left in place, or the same conclusion written out more than once on
      the way to a final version.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a sentence or block that is not the answer: preamble, process narration, self-talk, meta-commentary
      about skills or formatting, leaked reasoning, or a duplicated/superseded draft left in place. Record
      each finding with a verbatim quote (or an omission naming exactly what is missing); one you cannot
      quote or name does not count. Pick the band from the number of findings; none is the top band.
    - 'Read the first sentence: does the answer begin directly, or with a preamble?'
    - Scan the body and tail for leaked planning, self-talk, or meta-commentary.
    - >-
      Check whether any snippet, list, or conclusion appears more than once in different (superseded)
      forms - a sign of an abandoned draft left in place.
    - Check the structure (headings, lists) matches what the content actually needs.
    bands:
    - min: 3.0
      max: 3.0
      meaning: >-
        no finding: the answer begins and ends with the answer, and only the final version of any content
        appears.
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is one stray sentence (an opener or a meta remark) with the
        rest clean.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a paragraph of narration or reasoning, or a duplicated
        section.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or the answer opens with a preamble or planning, or a duplicated/superseded
        draft sits beside the final one.
    anchors:
    - omission
  grounded:
    definition: >
      Every statement in the answer traces to something visibly or audibly present in the media, and no
      detail is invented from the model's training knowledge - no specific name, number, date, or quoted
      phrase stated confidently that is not present in the media. Over-inference - drawing conclusions
      the media does not support, even without fabricating a specific - fails this criterion too.
    guidance: >
      Two failure modes, one criterion: over-inference (a conclusion the media doesn't support) and commission
      (a specific added that was never there). Do not score a proper noun as hallucinated merely because
      you do not recognise it - a name or term you are unfamiliar with may be exactly what the media contains.
      A specific is suspect only when the answer's own text is internally inconsistent, or asserts it
      with no hedge in a context where it could not have been read/heard from the media.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a non-trivial claim or specific (name, number, price, date, quote) with no inline citation, or one
      stated more confidently than the answer's own evidence supports. Record each finding with a verbatim
      quote (or an omission naming exactly what is missing); one you cannot quote or name does not count.
      Pick the band from the number of findings; none is the top band.
    - >-
      (image input) Inspect the image directly. Identify every claim in the answer (described objects,
      text, layout, relationships, named entities, numbers, quoted phrases).
    - >-
      (image input) For each, verify it against what is actually visible. Flag any claim that goes beyond
      what the image shows, infers a relationship the image does not establish, or is absent from/contradicts
      what you see.
    - >-
      (image input) Check whether genuinely illegible text is flagged or given as a best-guess (acceptable)
      versus confidently asserted as exact (not acceptable).
    - >-
      (audio input) Identify every claim and specific in the answer (described content, quoted phrases,
      characterised events, named entities, numbers).
    - >-
      (audio input) For each, ask: does the answer present this as extracted from the audio, or does it
      assert something the audio would have to support - and could it plausibly come from training data
      instead?
    - >-
      (audio input) Check whether inaudible or unclear passages are flagged inline rather than silently
      presented as certain.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is a secondary detail (not a headline figure or a conclusion) and
        it is cited, only overstated.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a headline figure, a conclusion, or a specific with
        no citation at all.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or a name, number, or quote is contradicted by the answer's own evidence,
        or the majority of claims carry no citation.
    anchors:
    - omission
  internally_consistent:
    definition: >
      The answer does not contradict itself, and its conclusions follow from the content it presents.
      This criterion is about self-contradiction - not about faithfulness to the media (which `grounded`
      covers).
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      a place where the answer contradicts itself, a conclusion its own evidence does not support, or
      a hedge that later becomes a certainty. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - 'Check for self-contradiction: a claim in one section undercut by a claim in another.'
    - >-
      Check that structured sections (summary vs. detail, list items vs. conclusion) agree with each other.
    - >-
      Check that hedges are consistent - if the answer says "possibly X" in one place, it should not assert
      X as certain later.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: exactly one finding, and it is a hedge phrased unevenly with no actual contradiction.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one finding that is a contradiction between two claims, or a conclusion
        the cited evidence does not support.
    - min: 0.0
      max: 0.0
      meaning: four or more findings, or the main conclusion contradicts the answer's own evidence.
    anchors:
    - omission
