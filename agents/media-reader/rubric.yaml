scale:
  min: 0
  max: 2
  pass: 2
criteria:
  answers_question:
    definition: >
      The response addresses exactly what the user asked, in full - not a related-but-different question, and not a partial answer that drops part of the request.
    steps:
    - Decompose the user's question into its distinct asks (e.g. "transcribe AND summarise AND list action items").
    - Check that each ask is addressed in the answer.
    - Note any silent narrowing or dropped sub-request.
    bands:
    - min: 2.0
      max: 2.0
      meaning: addresses the request completely, including all sub-asks.
    - min: 1.0
      max: 1.0
      meaning: addresses the main ask but leaves a minor sub-request unanswered.
    - min: 0.0
      max: 0.0
      meaning: misses the core ask or redirects to something different.
    anchors:
    - omission
  clean_output:
    definition: >
      The answer is formatted for the reader it is addressed to: scannable, and its structure matches its content. It begins directly with the answer and ends with it, with no preamble ("I can see…", "Let me analyse…"), no process narration, no meta-commentary about the media format or the agent's capabilities.
    guidance: >
      This includes mid-body deliberation: visible self-correction ("Actually, let me reconsider…"), an abandoned or superseded draft left in place, or the same conclusion written out more than once on the way to a final version.
    steps:
    - "Read the first sentence: does the answer begin directly, or with a preamble?"
    - Scan the body and tail for leaked planning, self-talk, or meta-commentary.
    - Check whether any snippet, list, or conclusion appears more than once in different (superseded) forms - a sign of an abandoned draft left in place.
    - Check the structure (headings, lists) matches what the content actually needs.
    bands:
    - min: 2.0
      max: 2.0
      meaning: pure answer, well-structured for its content; no preamble, narration, or trailing reasoning; only the final version of any content appears.
    - min: 1.0
      max: 1.0
      meaning: a stray opener or a single meta sentence, or structure that doesn't quite fit the content, otherwise clean.
    - min: 0.0
      max: 0.0
      meaning: noticeable preamble, leaked planning/reasoning, or a duplicated/superseded draft left in the output.
    anchors:
    - omission
  grounded:
    definition: >
      Every statement in the answer traces to something visibly or audibly present in the media, and no detail is invented from the model's training knowledge - no specific name, number, date, or quoted phrase stated confidently that is not present in the media. Over-inference - drawing conclusions the media does not support, even without fabricating a specific - fails this criterion too.
    guidance: >
      Two failure modes, one criterion: over-inference (a conclusion the media doesn't support) and commission (a specific added that was never there). Do not score a proper noun as hallucinated merely because you do not recognise it - a name or term you are unfamiliar with may be exactly what the media contains. A specific is suspect only when the answer's own text is internally inconsistent, or asserts it with no hedge in a context where it could not have been read/heard from the media.
    steps:
    - (image input) Inspect the image directly. Identify every claim in the answer (described objects, text, layout, relationships, named entities, numbers, quoted phrases).
    - (image input) For each, verify it against what is actually visible. Flag any claim that goes beyond what the image shows, infers a relationship the image does not establish, or is absent from/contradicts what you see.
    - (image input) Check whether genuinely illegible text is flagged or given as a best-guess (acceptable) versus confidently asserted as exact (not acceptable).
    - (audio input) Identify every claim and specific in the answer (described content, quoted phrases, characterised events, named entities, numbers).
    - "(audio input) For each, ask: does the answer present this as extracted from the audio, or does it assert something the audio would have to support - and could it plausibly come from training data instead?"
    - (audio input) Check whether inaudible or unclear passages are flagged inline rather than silently presented as certain.
    bands:
    - min: 2.0
      max: 2.0
      meaning: essentially every claim is traceable to the media; uncertain or unclear items are flagged or qualified; nothing reads as invented from training knowledge.
    - min: 1.0
      max: 1.0
      meaning: most claims are grounded, but a few specifics or inferences are asserted without hedging where the media was likely ambiguous, or minor secondary details look loosely inferred.
    - min: 0.0
      max: 0.0
      meaning: the answer draws conclusions or fills in details the media could not support, claims directly contradict what is visible/audible, or a name/number/quoted phrase is clearly not from the media and stated as fact.
    anchors:
    - omission
  internally_consistent:
    definition: >
      The answer does not contradict itself, and its conclusions follow from the content it presents. This criterion is about self-contradiction - not about faithfulness to the media (which `grounded` covers).
    steps:
    - "Check for self-contradiction: a claim in one section undercut by a claim in another."
    - Check that structured sections (summary vs. detail, list items vs. conclusion) agree with each other.
    - Check that hedges are consistent - if the answer says "possibly X" in one place, it should not assert X as certain later.
    bands:
    - min: 2.0
      max: 2.0
      meaning: fully consistent throughout; no internal contradictions.
    - min: 1.0
      max: 1.0
      meaning: minor tensions that do not undermine the core answer.
    - min: 0.0
      max: 0.0
      meaning: clear contradictions, or conclusions the presented content does not support.
    anchors:
    - omission
