name: cd

# Publishes the GHCR image. TWO triggers:
#   - push to main  → moves `:latest` (+ sha-<sha>). This is the auto-cut-on-merge
#     path: every merged PR becomes the new :latest, which Watchtower auto-deploys.
#   - version tag   → an immutable snapshot `1.2.3` / `1.2` (+ sha). Cut with
#     `git tag v1.2.3 && git push origin v1.2.3` when you want a pinned release.
# `:latest` tracks main (not tags), so a tag never silently moves prod.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tag push → the semver (0.19.1). Main push → metadata-action would say
          # "latest", identical across every main build; a bundle manifest needs to
          # name ONE build, so stamp the sha instead.
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || format('main-{0}', github.sha) }}
          # SLSA provenance + SBOM are near-free here and give consumers supply-chain
          # attestations. Trivy scanning / cosign signing are the next step if needed.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
