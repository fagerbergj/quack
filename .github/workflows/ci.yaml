name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # local, not auto (#936): catch a dep bump needing a newer toolchain here,
    # not masked by CI's own network - the runtime sandbox has none.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/vetting's mermaid tests shell out to scripts/mermaid-validate.mjs
      # (#574) - node + its deps must be on PATH for that coverage to actually run
      # rather than skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - name: cache skill plugins
        uses: actions/cache@v6
        with:
          path: .agents/vendor
          key: plugins-${{ hashFiles('.agents/vendor/plugins.yaml') }}
      - name: fetch skill plugins (not in git; go:embed needs them)
        run: ./scripts/plugins.sh
      - run: go vet ./...
      # One pass, under the race detector: it is a superset of the plain run and the
      # concurrency regression guards (#1016, #1032) pass vacuously without it.
      # -timeout bounds the whole run well inside the job's 20-minute ceiling,
      # so a future hang dumps goroutines (SIGQUIT) instead of the job
      # silently cancelling with no diagnostic output.
      - run: go test -race -timeout 12m ./...

  go-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal cmd)"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: make docs-check

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned to go.mod's toolchain: `@latest` alone builds against whatever the
      # tool's own go.mod allows, which can lag and then refuse to analyze this repo.
      - name: cache skill plugins
        uses: actions/cache@v6
        with:
          path: .agents/vendor
          key: plugins-${{ hashFiles('.agents/vendor/plugins.yaml') }}
      - name: fetch skill plugins (not in git; go:embed needs them)
        run: ./scripts/plugins.sh
      - run: GOTOOLCHAIN=go1.26.5 go install golang.org/x/tools/cmd/deadcode@latest
      # -test so test-only helpers don't false-positive as unreachable. Package
      # patterns are explicit (not ./...) so a vendored JS package that happens to
      # ship Go source (frontend/node_modules/flatted) never gets pulled in.
      # Dependency modules are filtered out (pkg/mod) - this gate polices quack's
      # own code; an extension module's unused helpers are its repo's problem.
      # Print findings before failing - `test -z "$(...)"` swallows them, so a
      # red build says something is unreachable without ever saying what.
      - run: |
          out=$($(go env GOPATH)/bin/deadcode -test ./cmd/... ./internal/... . | grep -v '/pkg/mod/' || true)
          if [ -n "$out" ]; then
            echo "::error::unreachable code found - delete it or wire it up:"
            echo "$out"
            exit 1
          fi

  # Slop gate: CC + duplication on changed code (golangci-lint,
  # new-from-rev) + the comment-run gate (tools/sloplint). Pre-existing
  # slop is tracked by the report-only `make slop` ledger, not CI.
  go-slop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: cache skill plugins
        uses: actions/cache@v6
        with:
          path: .agents/vendor
          key: plugins-${{ hashFiles('.agents/vendor/plugins.yaml') }}
      - name: fetch skill plugins (not in git; go:embed needs them)
        run: ./scripts/plugins.sh
      # Pinned: an unpinned @latest gate can shift findings (or break the
      # config schema) outside the PR author's control; key carries the version.
      - name: cache golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-2.13.2-${{ runner.os }}-${{ hashFiles('.golangci.yml') }}
      - name: install golangci-lint
        run: |
          [ -x "$HOME/go/bin/golangci-lint" ] || \
            GOTOOLCHAIN=go1.26.5 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: slop gate (changed code only)
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $(go env GOPATH)/bin/golangci-lint run --new-from-rev "$SLOP_BASE" ./cmd/... ./internal/...
          go run ./tools/sloplint diff "$SLOP_BASE"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint src/
        working-directory: frontend
      - run: npm run check-stories
        working-directory: frontend
      - run: npm run check-no-emoji
        working-directory: frontend
      - run: npm run check-icons
        working-directory: frontend
      - run: npm run knip
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # No --with-deps: it runs apt-get update, which fails whenever Google's
      # chrome apt mirror is inconsistent, and the runner already ships every
      # library Chromium needs (the step installed nothing on passing runs).
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run render-check
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Lint (eslint incl. the CC-15 slop rule + the three content checks)
      # was never gated in CI - it only ran locally.
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes @redocly/cli@latest lint openapi.yaml --config redocly.yaml

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/generate.sh
      - name: fail on uncommitted codegen drift
        run: git diff --exit-code -- internal/schema frontend/src/generated

  # Build the image (no push) so a broken Dockerfile or go:embed path fails the
  # PR instead of only surfacing at `make docker-up`. gha cache makes reruns fast.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: quack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # #951: `quack sandbox check` constructs the SAME Caps/WrapArgv/spawnEnv
      # an ACP agent gets, so a sandbox regression fails CI instead of the
      # next live review discovering it. --network none matches the probes'
      # own "no live network" expectations (go build offline, git push denied).
      - name: quack sandbox check
        run: |
          docker run --rm --network none \
            -e QUACK_WORKSPACE_ROOT=/tmp/workspace \
            quack:ci sandbox check --agent code-reviewer
