name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Path filter for pull requests: a job whose inputs a PR never touched is skipped.
  # Pushes to main skip the filter and run every job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      storybook: ${{ steps.filter.outputs.storybook }}
      image: ${{ steps.filter.outputs.image }}
      prompts: ${{ steps.filter.outputs.prompts }}
      pig: ${{ steps.filter.outputs.pig }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          # Go tests read config/, agents/, skills/, testdata and extension plugin dirs,
          # so everything but the SPA, the storybook and prose counts as Go input.
          filters: |
            go:
              - '**'
              - '!frontend/**'
              - '!extensions/sleeper/ui/storybook/**'
              - '!docs/**'
              - '!*.md'
            frontend:
              - '{frontend/**,openapi.yaml,scripts/coverage-diff.mjs,.github/workflows/ci.yaml}'
            storybook:
              - '{extensions/sleeper/ui/**,.github/workflows/ci.yaml}'
            image:
              - '**'
              - '!docs/**'
              - '!*.md'
            prompts:
              - '{agents/**,config/**,skills/**,.agents/embedded/**,extensions/**,internal/tools/**,internal/vetting/**,tools/promptlint/**,go.mod,.github/workflows/ci.yaml}'
            pig:
              - '{tools/pi-acp/**,Dockerfile,.github/workflows/ci.yaml}'

  go-test:
    permissions:
      contents: read
      pull-requests: write   # the coverage gate comments its misses on the PR
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # local, not auto (#936): catch a dep bump needing a newer toolchain here,
    # not masked by CI's own network - the runtime sandbox has none.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          # the changed-line coverage gate diffs against the PR base SHA.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/vetting's mermaid tests shell out to scripts/mermaid-validate.mjs
      # (#574) - node + its deps must be on PATH for that coverage to actually run
      # rather than skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: node tools/pi-acp/test.mjs
      - run: go vet ./...
      # One pass, under the race detector: it is a superset of the plain run and the
      # concurrency regression guards (#1016, #1032) pass vacuously without it.
      # The same pass writes the coverprofile the coverage gate reads, so the
      # suite never runs twice. -timeout bounds the whole run well inside the
      # job's 20-minute ceiling, so a future hang dumps goroutines (SIGQUIT)
      # instead of the job silently cancelling with no diagnostic output.
      - run: go test -race -coverprofile=cover.out -timeout 12m ./...
      # extensions/sdk is its own module (outside extension authors depend on it alone), so ./... skips it;
      # its profile joins cover.out for the gate below.
      - run: |
          go -C extensions/sdk vet ./...
          go -C extensions/sdk test -race -coverprofile=cover.out ./...
          tail -n +2 extensions/sdk/cover.out >> cover.out
      # quackgate, the PIG engine's fused gate, is its own module; its profile joins cover.out for the gate below.
      - run: |
          go -C tools/pi-acp/pig/quackgate vet ./...
          go -C tools/pi-acp/pig/quackgate test -race -coverprofile=cover.out ./...
          tail -n +2 tools/pi-acp/pig/quackgate/cover.out >> cover.out
      # Changed-line coverage gate: new code ships covered (>=70%).
      - name: coverage gate (changed code only)
        if: github.event_name == 'pull_request'
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(go run ./tools/coverdiff diff --profile cover.out "$SLOP_BASE" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" -ne 0 ]; then
            {
              echo "### Coverage gate: changed lines below the 70% floor"
              echo ""
              echo '```'
              printf '%s\n' "$OUT" | grep -E '^coverdiff:|^  uncovered:'
              echo '```'
              echo ""
              echo "Cover the changed lines above (or split the change).";
            } | gh pr comment "${{ github.event.pull_request.number }}" --body-file -
            exit "$RC"
          fi

  go-fmt:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal cmd extensions tools)"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: make docs-check

  deadcode:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned (tool and toolchain) so findings only shift on a deliberate bump;
      # the cache key carries the version.
      - name: cache deadcode
        uses: actions/cache@v6
        with:
          path: ~/go/bin/deadcode
          key: deadcode-x-tools-v0.50.0-go1.26.5-${{ runner.os }}
      - name: install deadcode
        run: |
          [ -x "$HOME/go/bin/deadcode" ] || \
            GOTOOLCHAIN=go1.26.5 go install golang.org/x/tools/cmd/deadcode@v0.50.0
      # -test so test-only helpers don't false-positive as unreachable. Package
      # patterns are explicit (not ./...) so a vendored JS package that happens to
      # ship Go source (frontend/node_modules/flatted) never gets pulled in.
      # Dependency modules are filtered out (pkg/mod) - this gate polices quack's
      # own code, extensions included.
      # Print findings before failing - `test -z "$(...)"` swallows them, so a
      # red build says something is unreachable without ever saying what.
      - run: |
          out=$($(go env GOPATH)/bin/deadcode -test ./cmd/... ./internal/... ./extensions/... . | grep -v '/pkg/mod/' || true)
          if [ -n "$out" ]; then
            echo "::error::unreachable code found - delete it or wire it up:"
            echo "$out"
            exit 1
          fi

  # Slop gate: CC + duplication on changed code (golangci-lint,
  # new-from-rev) + the comment-run gate (tools/sloplint). Pre-existing
  # slop is tracked by the report-only `make slop` ledger, not CI.
  go-slop:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned: an unpinned @latest gate can shift findings (or break the
      # config schema) outside the PR author's control; key carries the version.
      - name: cache golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-2.13.2-${{ runner.os }}-${{ hashFiles('.golangci.yml') }}
      - name: install golangci-lint
        run: |
          [ -x "$HOME/go/bin/golangci-lint" ] || \
            GOTOOLCHAIN=go1.26.5 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: slop gate (changed code only)
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # --max-same-issues=0: the default cap of 3 per identical message
          # would let a PR ship a 4th unchecked Close of the same kind.
          $(go env GOPATH)/bin/golangci-lint run --new-from-rev "$SLOP_BASE" --max-same-issues=0 --max-issues-per-linter=0 ./cmd/... ./internal/... ./extensions/...
          (cd extensions/sdk && $(go env GOPATH)/bin/golangci-lint run --new-from-rev "$SLOP_BASE" --max-same-issues=0 --max-issues-per-linter=0 ./...)
          (cd tools/pi-acp/pig/quackgate && $(go env GOPATH)/bin/golangci-lint run --new-from-rev "$SLOP_BASE" --max-same-issues=0 --max-issues-per-linter=0 ./...)
          go run ./tools/sloplint diff "$SLOP_BASE"

  # Prompt and tool-definition lint (docs/promptlint.md): token budgets, broken
  # refs, overlapping tools offered to one agent. A PR gates only what it touched.
  prompt-lint:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.prompts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: promptlint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then go run ./tools/promptlint diff "$BASE"; else go run ./tools/promptlint check; fi

  frontend-build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # eslint and check-* run in frontend-test's `npm run lint`; `npm run build` runs tsc.
      - run: npm run knip
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  render-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Browsers are cached per playwright version; the install below is a no-op on a hit.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: it runs apt-get update, which fails whenever Google's
      # chrome apt mirror is inconsistent, and the runner already ships every
      # library Chromium needs (the step installed nothing on passing runs).
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run render-check
        working-directory: frontend

  frontend-test:
    permissions:
      contents: read
      pull-requests: write   # the coverage gate comments its misses on the PR
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the changed-line coverage gate diffs against the PR base SHA.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # One vitest run; its coverage feeds the gate below.
      - run: npm test -- --coverage
        working-directory: frontend
      # Changed-line coverage gate: new code ships covered (>=70%).
      - name: changed-line coverage (frontend)
        if: github.event_name == 'pull_request'
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        working-directory: frontend
        run: |
          set +e
          OUT=$(node ../scripts/coverage-diff.mjs "$SLOP_BASE" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" -ne 0 ]; then
            {
              echo "### Coverage gate: changed lines below the 70% floor (frontend)"
              echo ""
              echo '```'
              printf '%s\n' "$OUT" | grep -E '^coverage-diff:|^  uncovered:'
              echo '```'
              echo ""
              echo "Cover the changed lines above (or split the change)."
            } | gh pr comment "${{ github.event.pull_request.number }}" --body-file -
            exit "$RC"
          fi

  sleeper-storybook:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/sleeper/ui/storybook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: extensions/sleeper/ui/storybook/package-lock.json
      - run: npm ci
      - run: npm run validate-schemas
      - run: npm run security-check
      - run: npm run pair-check
      - run: npm run talk-check
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps, as in render-check.
      - run: npx playwright install chromium
      - run: npm run render-check

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes @redocly/cli@2.54.3 lint openapi.yaml --config redocly.yaml
      - uses: actions/setup-go@v7
        if: github.event_name == 'pull_request'
        with:
          go-version-file: go.mod
      - name: breaking API change needs an x-api-version bump
        if: github.event_name == 'pull_request'
        env:
          API_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$API_BASE"
          scripts/check-api-compat.sh "$API_BASE"

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/generate.sh
      - name: fail on uncommitted codegen drift
        run: git diff --exit-code -- internal/schema frontend/src/generated internal/langfuse/langfusegen

  # Build the image (no push) so a broken Dockerfile or go:embed path fails the
  # PR instead of only surfacing at `make docker-up`. gha cache makes reruns fast.
  docker-build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: quack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # #951: `quack sandbox check` constructs the SAME Caps/WrapArgv/spawnEnv
      # an ACP agent gets, so a sandbox regression fails CI instead of the
      # next live review discovering it. --network none matches the probes'
      # own "no live network" expectations (go build offline, git push denied).
      - name: quack sandbox check
        run: |
          docker run --rm --network none \
            -e QUACK_WORKSPACE_ROOT=/tmp/workspace \
            quack:ci sandbox check --agent code-reviewer
      # The opt-in PIG engine: the shim's real-engine suite (gate, bridge, steer, cancel, resume) against the
      # image's own pig-quack and mock-openai.mjs. HOME=/tmp because nonroot has no home; quack always sets one.
      - name: pi-acp real-engine test (pig-quack)
        if: github.event_name == 'push' || needs.changes.outputs.pig == 'true'
        run: |
          docker run --rm --network none -v "$PWD/tools/pi-acp:/pi-acp:ro" -w /tmp \
            -e HOME=/tmp -e PI_ACP_REAL=1 -e PI_ACP_ENGINE=pig \
            --entrypoint node quack:ci /pi-acp/test.mjs
