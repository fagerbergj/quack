name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # local, not auto (#936): catch a dep bump needing a newer toolchain here,
    # not masked by CI's own network - the runtime sandbox has none.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/vetting's mermaid tests shell out to scripts/mermaid-validate.mjs
      # (#574) - node + its deps must be on PATH for that coverage to actually run
      # rather than skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - name: cache skill plugins
        uses: actions/cache@v6
        with:
          path: .agents/vendor
          key: plugins-${{ hashFiles('.agents/vendor/plugins.yaml') }}
      - name: fetch skill plugins (not in git; go:embed needs them)
        run: ./scripts/plugins.sh
      - run: go vet ./...
      - run: go test ./...
      # Without -race the concurrency regression guards (#1016, #1032) pass vacuously.
      - run: go test -race ./...

  go-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal cmd)"

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned to go.mod's toolchain: `@latest` alone builds against whatever the
      # tool's own go.mod allows, which can lag and then refuse to analyze this repo.
      - name: cache skill plugins
        uses: actions/cache@v6
        with:
          path: .agents/vendor
          key: plugins-${{ hashFiles('.agents/vendor/plugins.yaml') }}
      - name: fetch skill plugins (not in git; go:embed needs them)
        run: ./scripts/plugins.sh
      - run: GOTOOLCHAIN=go1.26.5 go install golang.org/x/tools/cmd/deadcode@latest
      # -test so test-only helpers don't false-positive as unreachable. Package
      # patterns are explicit (not ./...) so a vendored JS package that happens to
      # ship Go source (frontend/node_modules/flatted) never gets pulled in.
      # Dependency modules are filtered out (pkg/mod) - this gate polices quack's
      # own code; an extension module's unused helpers are its repo's problem.
      # Print findings before failing - `test -z "$(...)"` swallows them, so a
      # red build says something is unreachable without ever saying what.
      - run: |
          out=$($(go env GOPATH)/bin/deadcode -test ./cmd/... ./internal/... . | grep -v '/pkg/mod/' || true)
          if [ -n "$out" ]; then
            echo "::error::unreachable code found - delete it or wire it up:"
            echo "$out"
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint src/
        working-directory: frontend
      - run: npm run check-stories
        working-directory: frontend
      - run: npm run knip
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run render-check
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes @redocly/cli@latest lint openapi.yaml --config redocly.yaml

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/generate.sh
      - name: fail on uncommitted codegen drift
        run: git diff --exit-code -- internal/schema frontend/src/generated

  # Build the image (no push) so a broken Dockerfile or go:embed path fails the
  # PR instead of only surfacing at `make docker-up`. gha cache makes reruns fast.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: quack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # #951: `quack sandbox check` constructs the SAME Caps/WrapArgv/spawnEnv
      # an ACP agent gets, so a sandbox regression fails CI instead of the
      # next live review discovering it. --network none matches the probes'
      # own "no live network" expectations (go build offline, git push denied).
      - name: quack sandbox check
        run: |
          docker run --rm --network none \
            -e QUACK_WORKSPACE_ROOT=/tmp/workspace \
            quack:ci sandbox check --agent code-reviewer
