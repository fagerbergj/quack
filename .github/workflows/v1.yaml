name: v1

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["v1", "main"]

# Each job's timeout is about three times its slowest recent success, so a hung step fails in minutes.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  # sloplint reads commits, so this job fetches the whole history for its diff against the base.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm run knip
      # Gates only lines this change touches.
      - if: github.event_name == 'pull_request'
        run: npm run sloplint -- diff origin/${{ github.base_ref }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test -w @quack/web

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    # The index tests run against a real Postgres, never a mock (A6).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUACK_TEST_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The reMarkable render tests draw a v6 page with rmc.
      - run: pip install --no-deps -r packages/remarkable/requirements.txt
      # The contracts tests diff OpenAPI versions with oasdiff; keep the pin in step with the Dockerfile.
      - run: |
          curl -fsSL -o oasdiff.tgz https://github.com/oasdiff/oasdiff/releases/download/v1.34.0/oasdiff_1.34.0_linux_amd64.tar.gz
          echo "7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a  oasdiff.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf oasdiff.tgz -C "$HOME/.local/bin" oasdiff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm run test:node

  # Branch protection requires this name; it passes only when every job above did.
  check:
    if: always()
    needs: [typecheck, lint, web, node]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.typecheck.result }}${{ needs.lint.result }}${{ needs.web.result }}${{ needs.node.result }}" = successsuccesssuccesssuccess

  # Each trunk push publishes an image the home server pins by commit, under the public quack package.
  image:
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quack:v1-${{ github.sha }}
          build-args: |
            QUACK_COMMIT=${{ github.sha }}
            QUACK_BUILT_AT=${{ steps.built.outputs.at }}
          cache-from: type=gha,scope=quack-v1
          cache-to: type=gha,mode=max,scope=quack-v1
