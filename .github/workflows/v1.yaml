name: v1

on:
  push:
    branches: ["v1", "main"]
  pull_request:
    branches: ["v1", "main"]

jobs:
  check:
    runs-on: ubuntu-latest
    # The index tests run against a real Postgres, never a mock (A6).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUACK_TEST_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The reMarkable render tests draw a v6 page with rmc.
      - run: pip install --no-deps -r packages/remarkable/requirements.txt
      # The contracts tests diff OpenAPI versions with oasdiff; keep the pin in step with the Dockerfile.
      - run: go install github.com/oasdiff/oasdiff@v1.34.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npx tsc -p tsconfig.json
      - run: npx tsc -p packages/web/tsconfig.json
      - run: npm test
      # Gates only lines this change touches.
      - if: github.event_name == 'pull_request'
        run: npm run sloplint -- diff origin/${{ github.base_ref }}

  # Session isolation is only provable against a real image under gVisor, so this job builds one and runs the live test.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Prod runs sessions under runsc; if the runner cannot install it, the test still runs under runc and the job warns.
      - id: runtime
        name: Install gVisor (runsc) as a Docker runtime
        run: |
          install_runsc() {
            curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg &&
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list &&
            sudo apt-get update && sudo apt-get install -y runsc &&
            sudo runsc install -- --network=host && sudo systemctl restart docker &&
            docker run --rm --runtime=runsc --network=host busybox true
          }
          if install_runsc; then echo "name=runsc" >> "$GITHUB_OUTPUT"; else echo "::warning::gVisor is unavailable on this runner; the isolation test runs under runc"; echo "name=runc" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: quack:isolation
          cache-from: type=gha,scope=quack-v1
      # The isolation test runs on host networking so the runner reaches the session on 127.0.0.1:8080; the egress test builds its own internal network and proxy.
      - run: set -o pipefail; node --test --test-reporter=spec packages/distributor/test/docker-live.test.ts | tee live.log; grep -q '^ℹ pass 2' live.log
        env:
          QUACK_LIVE_IMAGE: quack:isolation
          QUACK_LIVE_RUNTIME: ${{ steps.runtime.outputs.name }}
          QUACK_LIVE_NETWORK: host
          QUACK_LIVE_URL: http://127.0.0.1:8080

  # Each trunk push publishes an image the home server pins by commit, under the public quack package.
  image:
    if: github.event_name == 'push'
    needs: [check, isolation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quack:v1-${{ github.sha }}
          build-args: |
            QUACK_COMMIT=${{ github.sha }}
            QUACK_BUILT_AT=${{ steps.built.outputs.at }}
          cache-from: type=gha,scope=quack-v1
          cache-to: type=gha,mode=max,scope=quack-v1
