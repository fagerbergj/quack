name: v1

on:
  push:
    branches: ["v1"]
  pull_request:
    branches: ["v1"]

jobs:
  check:
    runs-on: ubuntu-latest
    # The index tests run against a real Postgres, never a mock (A6).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUACK_TEST_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: v1/.node-version
          cache: npm
          cache-dependency-path: v1/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npx tsc -p packages/web/tsconfig.json
      - run: npm test
      # Gates only lines this change touches, as the Go sloplint does for v0.
      - if: github.event_name == 'pull_request'
        run: npm run sloplint -- diff origin/${{ github.base_ref }}

  # Each trunk push publishes an image the home server pins by commit, under the public quack package.
  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: v1
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quack:v1-${{ github.sha }}
          cache-from: type=gha,scope=quack-v1
          cache-to: type=gha,mode=max,scope=quack-v1
