name: lint-ratchet

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint TS/JS files with Oxlint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t -d '' files < <(git diff -z --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          else
            mapfile -t -d '' files < <(git ls-files -z -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            npx --yes oxlint@1.95.0 --config .oxlintrc.json --max-warnings 0 "${files[@]}"
          fi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Lint and typecheck Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t -d '' files < <(git diff -z --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.py')
          else
            mapfile -t -d '' files < <(git ls-files -z -- '*.py')
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            uvx ruff@0.17.6 check "${files[@]}"
            uvx mypy@2.4.1 "${files[@]}"
          fi
