name: Feature / change request
description: A new capability or behavioural change — spec-shaped so it can be planned.
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        quack is **issue-driven and agent-executed**: a good issue is already half a spec. Fill the fields below and the `quack:plan` step (or a human planner) has what it needs. See [AGENTS.md → Spec-Driven Development](https://github.com/fagerbergj/quack/blob/main/AGENTS.md) and [CONTRIBUTING.md](https://github.com/fagerbergj/quack/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The concrete motivation — what's missing or wrong today, and why it matters. Not a solution yet.
      placeholder: "Code agents can't carry a repo's conventions across PRs because …"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: What this change should do. Prefer **reuse or extend** an existing seam over adding new machinery — name the code it should build on.
      placeholder: |
        - Add …
        - Rides on the existing `MemoryScope` / `repo:` bucket (internal/memory/scope.go)
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this explicitly does NOT cover — keeps the change bounded and the review honest.
      placeholder: "- Cross-repo memory\n- Changing the vector backend"
    validations:
      required: false
  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden actions
      description: What the implementation must never do (invariants, safety rails, things that would break another subsystem).
      placeholder: "- Must not edit generated files\n- Must not push to git from an ACP agent"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / test cases
      description: How we'll know it's done — 2–3 concrete input → output cases. These become the tests; behavioural drift is a failing test, not an incident.
      placeholder: |
        1. Stage a convention in chat A → recall it in chat B on the same repo.
        2. Different repo → does NOT see it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - agents (agents, skills, memory, tools)
        - github (GitHub App / webhook)
        - frontend (React / Vite)
        - orchestrator / DAG / gate
        - inference / models
        - other / not sure
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "high — do next"
        - "medium — soon"
        - "low — nice to have"
    validations:
      required: false
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity / design
      description: Design-heavy work should be human-led — a maintainer will add `needs-design` and NOT `quack:implement` it blindly.
      options:
        - "low — small, contained"
        - "medium — several files / moderate design"
        - "high — cross-cutting / large surface"
        - "design-heavy — needs a human-led design pass first"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is a real, current need (not speculative "might want later").
          required: true
