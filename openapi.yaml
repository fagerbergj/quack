openapi: 3.0.3
info:
  title: Quack
  version: 0.2.0
  description: |
    Quack's HTTP API, modelled after the OpenResponses specification.
    Each chat turn is a Response containing typed OutputItems. The DAG is a
    first-class output item type (quack:dag) - a custom extension alongside
    the standard message item. The send endpoint streams over Server-Sent Events;
    its vocabulary is documented in prose and via the x-sse-events extension.
servers:
  - url: /

# internal/auth.Middleware: trusted header wins if present, else a verified
# OIDC bearer token - either alone satisfies a request, not both.
security:
  - bearerAuth: []
  - trustedHeader: []

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Liveness check
      # Liveness probe; requireAuthExceptHealth always lets it through unauthenticated.
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /api/v1/chats:
    get:
      operationId: listChats
      summary: List chats
      description: >
        A conditional GET: the 200 body's content hash is returned as an
        `ETag` (weak, `W/"..."`, varying with page content, next_page_token,
        and effectively limit/page_token/status since those change the
        content). Send it back as `If-None-Match` on a later poll of the
        exact same page to get a bodyless 304 when nothing changed - there is
        no separate cache TTL, so every poll still reaches the server and
        revalidates against the live rows.
      parameters:
        - name: limit
          in: query
          required: false
          description: Max chats to return. Defaults to 20; capped at 100.
          schema:
            type: integer
        - name: page_token
          in: query
          required: false
          description: >
            Opaque continuation token from a previous response's `next_page_token`.
            Treat it as an opaque string: never parse or construct one, pass back
            exactly what was returned. Omit for the first page.
          schema:
            type: string
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [active, archived]
            default: [active]
            minItems: 1
          description: >
            Which chat statuses to return - repeatable (`?status=active&status=archived`).
            Defaults to `[active]` (excludes archived) when omitted. An
            explicitly empty selection is a 400, not "everything" - ask for
            both statuses to get everything. Supersedes `show_archived`; if
            both are given, `status` wins. Each distinct combination of
            statuses pages independently - a page_token is only valid against
            the combination it was issued for.
        - name: show_archived
          in: query
          required: false
          deprecated: true
          schema:
            type: boolean
            default: false
          description: >
            Deprecated, use `status`. Ignored when `status` is given.
            Otherwise: false (default) behaves as `status=active`, true as
            `status=active&status=archived`.
        - name: If-None-Match
          in: header
          required: false
          description: >
            An ETag from a previous response to this exact page (same limit,
            page_token, and status selection). A match short-circuits to a
            bodyless 304.
          schema:
            type: string
      responses:
        "200":
          description: The chats
          headers:
            ETag:
              description: Weak validator hashed from the response body; echo it back as If-None-Match to revalidate cheaply.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
        "304":
          description: Not modified - If-None-Match matched the current ETag for this exact page
        "400":
          description: An explicitly empty status selection, or an invalid page_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createChat
      summary: Create a chat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatBody"
      responses:
        "200":
          description: The created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSummary"

  /api/v1/chats/{chat_id}:
    get:
      operationId: getChat
      summary: Get a chat with its turns
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteChat
      summary: Delete a chat
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateChat
      summary: Update a chat's mutable fields
      description: |
        Partial update of a chat's mutable metadata. Today the only settable
        field is `title` (a manual rename - overwrites whatever title, auto-
        generated or previously set, the chat had before); the body shape
        leaves room to grow without a new endpoint.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSummary"
        "404":
          description: No such chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/extensions:
    get:
      operationId: listExtensions
      summary: List enabled extensions for SPA nav
      description: >
        Every enabled quack-extensions SDK module, name-only unless it
        implements the SDK's optional UI descriptor (`sdk.UI`). `href` is a
        same-origin relative reference into the extension's own routes
        (e.g. `/remarkable/review`), never an absolute URL. Same auth as the
        rest of /api/v1 - this reveals which extensions are enabled, no more
        sensitive than the config file itself.
      responses:
        "200":
          description: The enabled extensions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtensionInfo"

  /api/v1/config:
    get:
      operationId: getConfig
      summary: Read-only, client-visible server config
      description: >
        Deployment-level values the SPA needs to render but must not
        hardcode. Currently just `otel_trace_url_template` (raw `{trace_id}`
        template, not a pre-rendered URL - see the `trace_id` field on
        `agent_start`/`node_start`/`dag_plan`/`delivery_result`). Same auth
        as the rest of /api/v1, no more sensitive than the config file itself.
      responses:
        "200":
          description: Client config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfig"

  /api/v1/recordings:
    get:
      operationId: listRecordings
      summary: List recorded chat sessions
      description: |
        Every session the replay ledger has an entry for (internal/ledger's
        `LedgerStore.List`), backing `quack recording list`/export. 200 with
        an empty array when recording is enabled but nothing has been
        recorded yet; 404 when recording is disabled entirely - same
        disabled signal as `getChatRecording`. Deliberately unpaginated: one
        entry per recorded session, bounded by the ledger's own retention_days
        GC, not an open-ended table - unlike /chats it has no realistic path
        to needing a page_token.
      responses:
        "200":
          description: The recorded sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingList"
        "404":
          description: Recording is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/recording:
    get:
      operationId: getChatRecording
      summary: Download a chat's replay-ledger recording bundle
      description: |
        Streams a self-contained ZIP export of the chat's replay ledger:
        `manifest.json` (quack version, gen_ai semconv version, session id,
        recording flags) + `entries.jsonl` (the session's OTel event stream,
        including gate-probe outputs) + an optional `clone.bundle` when a
        clone snapshot was recorded for this session. See
        `.quack/replay-log.md`. 404 when the session has no recording (never
        recorded, already GC'd by retention, or recording disabled).
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "200":
          description: The recording bundle (ZIP)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: No recording exists for this chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/artifacts:
    get:
      operationId: listChatArtifacts
      summary: List a chat's artifacts
      description: >
        Every artifact name visible to this chat, each with its full
        revision history (oldest first) - the durable store behind
        historical attachment viewing, the reMarkable review page fetching
        the scan under review, and replay debugging. Nested under chats so
        chat access is artifact access - no new authz surface. Read-only:
        bytes enter only via dispatch/run-start, never through this API;
        lifecycle rides chat deletion. Deliberately unpaginated: bounded per
        chat, not an open-ended table (mirrors /api/v1/recordings).
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "200":
          description: The chat's artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "404":
          description: No such chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/artifacts/{artifact_name}:
    get:
      operationId: getChatArtifact
      summary: Download one artifact revision's bytes
      description: >
        Latest revision by default; pass `?revision=n` for an older one.
        Security: `Content-Disposition` defaults to `attachment`; only an
        allowlisted set of image MIME types render inline
        (`Content-Disposition: inline`) - SVG is deliberately NOT on that
        list (same-origin stored-XSS via an SVG "image" is the trap this
        guards against, so anything HTML-capable stays a forced download).
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ArtifactName"
        - name: revision
          in: query
          required: false
          description: Which revision to fetch. Defaults to the latest.
          schema:
            type: integer
      responses:
        "200":
          description: The artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such chat, artifact, or revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/responses:
    post:
      operationId: sendChatMessage
      summary: Send a message and stream the response
      description: |
        Streams the orchestrator's response as Server-Sent Events. Each event is
        `event: <name>` followed by `data: <json>`.

        The model is flat and agent-centric: the DAG (dag_plan + node_* events) is
        the static structure, and within each node the trust gate runs a SEQUENCE
        of agent invocations ("runs") - the worker draft, each judge round, and
        each revision. Every run is delimited by `agent_start` / `agent_complete`
        and carries a `run_id` + `stage` (`worker` | `judge` | `revise`); its
        activity references that `run_id`. Clients group runs by `node_id` and
        pair tools by `call_id`. A worker's advisor consultations (`ask_advisor`)
        are NOT a separate stage - they surface as ordinary tool activity
        (`agent_tool_call` / `agent_tool_result`) within the worker's own run.

        Agent-run events: `agent_start` ({"node_id","run_id","agent","stage","round",
        "started_at_ms","trace_id"}) opens a run - `started_at_ms` is the
        server wall-clock (epoch ms) it began, anchoring the run's timer across
        reconnect/replay; `trace_id` cross-references the OTel trace for
        the run, empty when otel is disabled;
        `agent_thinking` ({"node_id","run_id","text"}) is reasoning;
        `agent_tool_call` ({"node_id","run_id","call_id","name","args"}) and
        `agent_tool_result` ({"node_id","run_id","call_id","name","result"}) are
        tool activity; `agent_token` ({"node_id","run_id","text"}) is answer text
        (the final vetted answer is emitted with an empty `run_id` - it belongs to
        the node); `agent_complete` ({"node_id","run_id","stage",...}) closes a run
        with its stage-specific result - judge runs carry `score`/`passed`/
        `feedback` (or `status`+`reason` when no verdict was produced:
        `status:"unavailable"` when the judge model itself couldn't be reached,
        `status:"no_verdict"` when it ran but never committed a verdict), model
        runs carry `finish_reason` + token usage.

        DAG events: `dag_plan` ({"plan_id","nodes","edges","trace_id"})
        signals a quack:dag output item has been added; `node_queued`
        ({"node_id"}), `node_start` ({"node_id","agent","trace_id"}),
        `node_done` ({"node_id",...metadata}),
        `node_failed` ({"node_id","error"}), `node_cancelled` ({"node_id"}), and
        `node_paused` ({"node_id"}) track node lifecycle. `node_steered`
        ({"node_id","guidance"}) fires when a node's queued message(s) are
        delivered at its next turn boundary and it re-runs with them folded
        in. A node's pending queue itself (add/edit/remove) is tracked
        client-side from the POST/PATCH/DELETE `.../queue` responses, not a
        separate SSE event - those calls are synchronous and already tell the
        caller what changed.

        `delivery_result` ({"node_id","outcome","kind","url","error","trace_id"})
        reports one staged item's ACTUAL outward-boundary outcome (push +
        PR/review/comment), as the delivering extension observed it - never the
        worker's self-report. `outcome` is one of `delivered`, `draft` (a
        gate-failed PR opens as a draft), `failed`, or `none` (a judge-passed
        work-request that recorded no delivery attempt at all - the phantom-
        success class this event exists to make visible). Emitted for both
        success and failure, durably, independent of the judge verdict.

        Lifecycle: `response_created` ({"response_id"}) is the very first event
        of the stream, naming the turn so a client can cancel this run via
        `PUT /chats/{chat_id}/responses/{response_id}/status`; `chat_title`
        ({"title"}) is sent once the title is generated; `done` ({}) terminates
        the stream; `error` ({"error"}) signals failure.

        A `chat_id` naming no chat is validated BEFORE the stream opens - a
        clean 404, never an in-stream `error` event.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      x-sse-events:
        - response_created
        - agent_start
        - agent_thinking
        - agent_tool_call
        - agent_tool_result
        - agent_token
        - agent_complete
        - dag_plan
        - node_queued
        - node_start
        - node_done
        - node_failed
        - node_cancelled
        - node_needs_input
        - node_paused
        - node_steered
        - delivery_result
        - chat_title
        - done
        - error
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: No such chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/responses/{response_id}:
    get:
      operationId: getResponse
      summary: Get a specific response (turn) with its output items
      description: |
        Returns the full Turn for a response ID. Useful for fetching or
        refreshing a specific turn's output items (e.g. a quack:dag item)
        without reloading the full chat.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ResponseID"
      responses:
        "200":
          description: The response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/stream:
    get:
      operationId: subscribeChatStream
      summary: Subscribe to a chat's live response stream
      description: |
        Connect to the SSE stream of a chat's in-progress (or just-completed) run
        - so a turn started on one device can be watched from another. Replays the
        events so far, then streams live events until the run ends. If no run is
        active, replays the most recent completed run. Reconnect-safe via the
        replay buffer.

        A `chat_id` naming no chat is validated BEFORE the stream opens - a
        clean 404, never an in-stream `error` event.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      x-sse-events:
        - response_created
        - agent_start
        - agent_thinking
        - agent_tool_call
        - agent_tool_result
        - agent_token
        - agent_complete
        - dag_plan
        - node_queued
        - node_start
        - node_done
        - node_failed
        - node_cancelled
        - node_needs_input
        - node_paused
        - node_steered
        - delivery_result
        - chat_title
        - done
        - error
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: No such chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/nodes/{node_id}/status:
    put:
      operationId: updateNodeStatus
      summary: Transition a DAG node's status (cancel, pause/resume, or retry)
      description: |
        A single resource-oriented endpoint - the request body names the
        TARGET status:

        - `{"status":"cancelled"}` - cancel the node (legal from `queued`,
          `running`, `paused`, or `needs_input`). Kills the in-flight
          model/tool call via context; no resume. No-op (200, unchanged
          state) if the node isn't currently live.
        - `{"status":"paused"}` - suspend a RUNNING node at its next safe
          point, keeping its accumulated work. Only legal from `running`.
        - `{"status":"running"}` - resume a `paused` node: a fresh re-run
          (like retry) that reuses the rest of the plan's stored outputs.
          Only legal from `paused`.
        - `{"status":"queued","guidance":"..."}` - retry: re-run a finished
          node (and every node downstream of it) reusing the stored outputs
          of all other nodes. Only legal from `done`, `failed`, or
          `cancelled`. `guidance` is optional and folded into the node's task.

        To steer a running node with a message, POST to
        `.../nodes/{node_id}/queue` instead - it is delivered at the node's
        next turn boundary, never mid-turn (replaces the old interrupt-based
        steer).

        An illegal transition (e.g. `done` → `running`) returns 409 naming the
        allowed target statuses. The re-run (resume/retry) streams over the
        chat's existing SSE connection - this endpoint does not open a new one.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeStatusUpdateBody"
      responses:
        "200":
          description: The updated node state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DagNodeState"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Illegal transition; body names the allowed target statuses
            for the node's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionError"

  /api/v1/chats/{chat_id}/nodes/{node_id}/start:
    post:
      operationId: startNode
      summary: Start a node - queued or paused, either way, into running
      description: |
        The explicit per-node form of what shutdown/startup do to every node
        at once (#962): `queued` → running is a fresh dispatch; `paused` →
        running re-enters the stashed plan's graph at this node. If the node
        is paused with `pause_reason: awaiting_input`, `content` carries the
        answer to its parked question - the same field SendMessageBody uses,
        since answering a node's question and answering the chat are the same
        shape. Any other pause reason (`user`, `shutdown`) needs no `content`;
        it resumes at its last gate boundary.

        Illegal from any other status (409, naming the allowed targets). The
        resumed/dispatched run streams over the chat's existing SSE
        connection - this endpoint does not open a new one.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeStartBody"
      responses:
        "200":
          description: The node's new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DagNodeState"
        "404":
          description: No such node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Illegal transition; body names the allowed target statuses
            for the node's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionError"

  /api/v1/chats/{chat_id}/nodes/{node_id}/stop:
    post:
      operationId: stopNode
      summary: Stop a node - any non-terminal status, into cancelled
      description: |
        The explicit per-node "stop everything now" transition: legal from
        `queued`, `running`, or `paused`, always landing on the terminal
        `cancelled`. Cooperative for a running node (stops at its next safe
        point); immediate for `queued`/`paused`. No resume - retry (PUT
        .../status with `{"status":"queued"}`) is the way back.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: The node's new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DagNodeState"
        "404":
          description: No such node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Illegal transition (already terminal), or nothing
            live to act on (e.g. a queued node not yet dispatched); body
            names the allowed target statuses for the node's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionError"

  /api/v1/chats/{chat_id}/nodes/{node_id}:
    patch:
      operationId: editNodeTask
      summary: Edit a not-yet-started node's prompt
      description: |
        Replaces a pending node's task text before it starts running. Legal
        only while the node has no live/persisted "started" state (still
        `queued`, and not yet dispatched - e.g. a downstream node waiting on
        its dependencies in an already-streaming turn). Once a node has
        started, its prompt is immutable - 409.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditNodeTaskBody"
      responses:
        "200":
          description: Edited
        "404":
          description: No such node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The node has already started; its prompt is immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/nodes/{node_id}/queue:
    post:
      operationId: queueNodeMessage
      summary: Queue a message for a running node, delivered at its next turn boundary
      description: |
        Appends to the node's message queue - the replacement for the old
        interrupt-based steer. The node drains its queue (in order) at its
        next turn boundary; never mid-turn. Only legal while the node is
        `running` (404 if no live control).
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueMessageBody"
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedMessage"
        "404":
          description: No such node, or the node isn't running right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/nodes/{node_id}/queue/{message_id}:
    patch:
      operationId: editQueuedMessage
      summary: Edit a queued message that has not yet been delivered
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
        - $ref: "#/components/parameters/MessageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueMessageBody"
      responses:
        "200":
          description: Edited
        "404":
          description: No such queued message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already delivered; immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeQueuedMessage
      summary: Remove a queued message that has not yet been delivered
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Removed
        "404":
          description: No such queued message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already delivered; immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/{chat_id}/responses/{response_id}/status:
    put:
      operationId: updateResponseStatus
      summary: Cancel the chat's active run by response id
      description: |
        `{"status":"cancelled"}` cancels the active orchestrator run for this
        chat - only legal when response_id names the CURRENTLY active run (the
        id surfaced in the stream's opening `response_created` event). 404 if
        this response isn't the active run (already finished, or never was).
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ResponseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseStatusUpdateBody"
      responses:
        "204":
          description: Cancelled
        "400":
          description: Bad request (unsupported target status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: This response is not the active run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/memories:
    get:
      operationId: listMemories
      summary: Browse or search quack's semantic memory
      description: |
        Without `q`: lists a bucket's entries verbatim, newest first - what
        quack believes, not what it would recall for some query. An
        unreachable index is a 500; it never silently falls back to search or
        returns a partial result. With `q`: runs the same embedding search a
        live run's recall would use, so the tab can answer "what would a run
        recall for this?" - entries then carry `score`, ordered descending,
        and are never paginated (a top-K search, not a stable page).
      parameters:
        - name: bucket
          in: query
          description: Restrict to one bucket (e.g. `repo:NightsOut`, `role:coding`, `user:jason`). Omitted lists/searches every bucket.
          schema:
            type: string
        - name: q
          in: query
          description: Run an embedding search instead of listing; matches then carry `score`.
          schema:
            type: string
        - name: limit
          in: query
          description: Max memories to return. Defaults to 50; capped at 200.
          schema:
            type: integer
        - name: include_invalidated
          in: query
          description: Include invalidated memories (memory lifecycle design doc §4(d)). Defaults to false - a default listing shows only what quack currently trusts.
          schema:
            type: boolean
            default: false
        - name: page_token
          in: query
          required: false
          description: >
            Opaque continuation token from a previous response's
            `next_page_token`. Treat it as an opaque string: never parse or
            construct one, pass back exactly what was returned. Omit for the
            first page. Ignored when `q` is set (search ranks by score, not a
            stable page). Only valid against the exact `bucket` filter it was
            issued for.
          schema:
            type: string
      responses:
        "200":
          description: The matching memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
        "400":
          description: Malformed page_token, or one issued for a different bucket filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The memory index is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/memories/{memory_id}:
    delete:
      operationId: deleteMemory
      summary: Invalidate one memory
      description: |
        Soft-delete (memory lifecycle design doc §4(b)): the point stays in
        the index with `status: invalidated` and an `invalidation_reason` -
        never removed - so a default listing excludes it but the audit trail
        (`memory_ops`, actor `human`) and `include_invalidated=true` still see it.
      parameters:
        - $ref: "#/components/parameters/MemoryID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMemoryBody"
      responses:
        "204":
          description: Invalidated
        "404":
          description: No such memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ChatID:
      name: chat_id
      in: path
      required: true
      schema:
        type: string

    NodeID:
      name: node_id
      in: path
      required: true
      schema:
        type: string

    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        type: string

    ResponseID:
      name: response_id
      in: path
      required: true
      schema:
        type: string

    MemoryID:
      name: memory_id
      in: path
      required: true
      schema:
        type: string

    ArtifactName:
      name: artifact_name
      in: path
      required: true
      schema:
        type: string

  schemas:

    # -------------------------------------------------------------------------
    # Chat
    # -------------------------------------------------------------------------

    ChatStatus:
      type: string
      description: >
        A chat's derived state: `queued` when a turn has been admitted but is
        waiting on the server's max_active_runs slot, `running` while a turn
        holds its slot and is actively streaming, `needs_input` when the last
        turn paused on an unanswered question (a mid-node ask, a guarded
        operation awaiting approve/deny - the workspace.guards confirm tier -
        or a top-level clarification), `failed` when the last turn's DAG has a
        failed node and no answer text followed, else `idle`.
      enum: [queued, running, needs_input, failed, idle]

    ChatOrigin:
      type: object
      description: >
        Generic provenance for an extension-dispatched chat: how the SPA
        should present and group it, without the SPA knowing which
        extension produced it. Server-stamped only - an extension can set
        this only via Dispatch, never through a writable API.
      required: [extension, label]
      properties:
        extension:
          type: string
          description: Registration name of the extension that dispatched this chat, e.g. "remarkable".
        label:
          type: string
          description: Display handle, e.g. a document title or "owner/repo#42".
        kind:
          type: string
          description: Grouping category, e.g. "document", "pr".
        href:
          type: string
          description: The chat subject's one navigable link.
        badge:
          type: string
          description: Optional short status chip, e.g. "draft".
        labels:
          type: object
          description: >
            Extra grouping dimensions beyond kind - repo, state, tags,
            whatever the extension's domain needs - keyed for grouping (the
            sidebar renders one labeled section per key) and slice-valued
            because a single chat can carry several values on one dimension.
          additionalProperties:
            type: array
            items:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: Raw value; what matching/counting keys on.
                display:
                  type: string
                  description: Display text; falls back to value when absent.
                href:
                  type: string
                  description: Optional link-out for this value.

    ChatSummary:
      type: object
      required: [id, system_prompt, created_at, updated_at, status]
      properties:
        id:
          type: string
        title:
          type: string
        system_prompt:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ChatStatus"
        pending_question:
          type: string
          description: The unanswered question blocking the chat, present only when status is `needs_input`.
        github_url:
          type: string
          description: Web URL of the originating GitHub issue/PR, present only for GitHub-originated chats.
        github_repo:
          type: string
          description: "`<owner>/<repo>` of the originating GitHub issue/PR, present only for GitHub-originated chats."
        github_state:
          type: string
          enum: [open, closed, merged, draft]
          description: "Current state of the originating GitHub issue/PR. Only set when quack has observed the resource at dispatch time; absent otherwise."
        archived:
          type: boolean
          description: True if the chat is archived and hidden from the main list by default.
        origin:
          $ref: "#/components/schemas/ChatOrigin"
        total_tokens:
          type: integer
          description: >
            Chat-wide token total (turns + DAG nodes) - compact so the sidebar
            list doesn't pay for the full input/output/reasoning/cached split;
            see ChatDetail.usage for that.

    ChatDetail:
      allOf:
        - $ref: "#/components/schemas/ChatSummary"
        - type: object
          required: [turns, usage]
          properties:
            turns:
              type: array
              items:
                $ref: "#/components/schemas/Turn"
            # Chat-wide token aggregate, summing every turn and DAG node.
            usage:
              $ref: "#/components/schemas/Usage"

    ChatList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChatSummary"
        next_page_token:
          type: string
          description: >
            Opaque token - pass as `page_token` to fetch the next page. Absent when
            this page is the last. Treat as an opaque string: never parse it.

    # -------------------------------------------------------------------------
    # Semantic memory (the M6 explorer - browse what quack believes, and forget)
    # -------------------------------------------------------------------------

    Memory:
      type: object
      required: [id, content, bucket, author, timestamp, kind]
      properties:
        id:
          type: string
        content:
          type: string
        bucket:
          type: string
          description: repo:<name> / role:<coding|research> / user:<name>, or a legacy raw key.
        author:
          type: string
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
        score:
          type: number
          format: float
          description: Cosine similarity to the search query. Present only when the request set `q`; meaningless (omitted) for a plain listing.
        status:
          type: string
          enum: [unverified, reinforced, invalidated]
          description: Epistemic tier (memory lifecycle design doc §3). A memory written before this field existed reads as `unverified`.
        reinforcement_count:
          type: integer
          description: How many positive outcome events (e.g. a PR merged) have reinforced this memory.
        invalidation_reason:
          type: string
          description: Why this memory was invalidated. Present only when `status` is `invalidated`.

    DeleteMemoryBody:
      type: object
      properties:
        reason:
          type: string
          description: Why this memory is being invalidated. Defaults to `"manual delete"` when omitted.

    MemoryList:
      type: object
      required: [memories, total]
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        total:
          type: integer
          description: Total entries matching the filter (not just this page). With `q`, this is just len(memories) - search returns a ranked top-K, not a stable count.
        next_page_token:
          type: string
          description: >
            Opaque token - pass as `page_token` to fetch the next page. Absent
            when this page is the last, or the request set `q`. Treat as an
            opaque string: never parse it.

    # -------------------------------------------------------------------------
    # Replay ledger
    # -------------------------------------------------------------------------

    RecordingSummary:
      type: object
      required: [chat_id, size_bytes, modified_at]
      properties:
        chat_id:
          type: string
        size_bytes:
          type: integer
          format: int64
        modified_at:
          type: string
          format: date-time

    RecordingList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSummary"

    # -------------------------------------------------------------------------
    # Extensions
    # -------------------------------------------------------------------------

    ExtensionInfo:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Registration name of the extension.
        title:
          type: string
          description: Display title for the nav entry; absent when the extension implements no UI descriptor.
        href:
          type: string
          description: Same-origin relative reference into the extension's own routes; absent when the extension implements no UI descriptor.
        icon:
          type: string
          description: Single emoji for nav display; absent when the extension's UI descriptor sets none.

    ClientConfig:
      type: object
      properties:
        otel_trace_url_template:
          type: string
          description: >
            Raw URL template for a trace deep link, with a literal
            "{trace_id}" placeholder for the client to substitute - e.g.
            "https://tracing.example.com/trace/{trace_id}". Absent when
            otel.trace_url_template is unset (no link should be rendered).

    # -------------------------------------------------------------------------
    # Artifacts (chat-scoped, read-only)
    # -------------------------------------------------------------------------

    ArtifactRevisionInfo:
      type: object
      required: [revision, mime_type, size]
      properties:
        revision:
          type: integer
          format: int64
        turn_id:
          type: string
          description: The turn that created this revision. Absent if unknown.
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    ArtifactSummary:
      type: object
      required: [name, revisions]
      properties:
        name:
          type: string
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactRevisionInfo"

    ArtifactList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactSummary"

    CreateChatBody:
      type: object
      properties:
        system_prompt:
          type: string

    SendMessageBody:
      type: object
      required: [content]
      properties:
        content:
          type: string

    NodeStatus:
      type: string
      description: |
        A DAG node's canonical lifecycle state. Legal transitions (enforced
        server-side by internal/dag.CanTransition):
          queued      → running, cancelled, failed (stale-on-restart)
          running     → paused, needs_input, done, failed, cancelled
          paused      → running (resume), cancelled
          needs_input → running (resumed), cancelled
          done        → queued (retry)
          failed      → queued (retry)
          cancelled   → queued (retry)
      enum: [queued, running, needs_input, paused, done, failed, cancelled]

    NodeStatusUpdateBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        guidance:
          type: string
          description: Optional and folded into the node's task when status is
            "queued" (retry, or resuming a paused node via a fresh re-run).
            Unused for "cancelled" and "paused". To steer a RUNNING node,
            queue a message instead (POST .../nodes/{node_id}/queue) - it is
            delivered at the node's next turn boundary, not mid-turn.
        reason:
          $ref: "#/components/schemas/PauseReason"
          description: Only meaningful when status is "paused". Defaults to
            "user" (a human hit pause). Clients may send only "user" or
            "shutdown" - "awaiting_input" is system-owned (400).

    PauseReason:
      type: string
      description: Why a node sits in the `paused` status.
      enum: [user, shutdown, awaiting_input]

    NodeStartBody:
      type: object
      properties:
        content:
          type: string
          description: Answer to the node's pending_question. Required when
            the node is paused with pause_reason "awaiting_input" (a blank
            answer is a 400) - the same field name SendMessageBody uses,
            since a node's question and the chat's are answered the same
            way. Ignored for every other status; a non-awaiting start is a
            fresh scoped re-run of the node and its descendants.

    QueuedMessage:
      type: object
      required: [id, text, delivered, created_at]
      properties:
        id:
          type: string
        text:
          type: string
        delivered:
          type: boolean
          description: True once handed to the node - immediately if its round
            was live (#998), otherwise at the next turn boundary; no longer
            editable or removable either way.
        created_at:
          type: string
          format: date-time

    QueueMessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string

    EditNodeTaskBody:
      type: object
      required: [task]
      properties:
        task:
          type: string

    UpdateChatBody:
      type: object
      properties:
        title:
          type: string
          description: New title for the chat. Omit to leave unchanged.
        archived:
          type: boolean
          description: Toggle archive. True = archive, False = unarchive. Omit to leave unchanged.

    ResponseStatus:
      type: string
      description: The only supported target status for a response - cancelling
        the active run. (A separate enum from NodeStatus, which has states with
        no meaning at the response/run level.)
      enum: [cancelled]

    ResponseStatusUpdateBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatus"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable summary of what went wrong.
        detail:
          type: string
          description: Optional additional context (e.g. which field failed validation).

    TransitionError:
      description: An illegal node-status transition - ErrorResponse refined with the
        node's current status and its legal targets.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [current, allowed]
          properties:
            current:
              $ref: "#/components/schemas/NodeStatus"
            allowed:
              type: array
              items:
                $ref: "#/components/schemas/NodeStatus"

    # -------------------------------------------------------------------------
    # Turn (one user→assistant exchange, modelled after OpenResponses Response)
    # -------------------------------------------------------------------------

    Turn:
      type: object
      required: [id, created_at, input, output]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        input:
          $ref: "#/components/schemas/TurnInput"
        output:
          type: array
          items:
            $ref: "#/components/schemas/OutputItem"
        usage:
          $ref: "#/components/schemas/Usage"
        model:
          type: string
          description: >
            Model that produced the orchestrator's own reply this turn.
            Absent for DAG turns (their models are per-node in DagNodeState).

    TurnInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user]
        content:
          type: string

    Usage:
      type: object
      description: >
        Token usage; the same schema is populated two different ways depending
        on where it appears. On Turn.usage it is SPARSE: a field is omitted
        entirely when its value is zero (or unknown for that turn), and
        reasoning folds into output_tokens rather than getting its own field.
        On ChatDetail.usage it is a chat-wide aggregate (every turn + every DAG
        node) and is ALWAYS FULLY POPULATED - every field is present, a
        genuine zero included, never omitted.
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        reasoning_tokens:
          type: integer
        cached_tokens:
          type: integer
          description: Subset of input_tokens served from the model's prompt cache.
        total_tokens:
          type: integer

    # -------------------------------------------------------------------------
    # Output items - discriminated by `type`
    # Standard: "message". Quack extension: "quack:dag".
    # -------------------------------------------------------------------------

    OutputItem:
      oneOf:
        - $ref: "#/components/schemas/MessageOutputItem"
        - $ref: "#/components/schemas/DagOutputItem"
        - $ref: "#/components/schemas/AgentActivityOutputItem"
      discriminator:
        propertyName: type
        mapping:
          message: "#/components/schemas/MessageOutputItem"
          "quack:dag": "#/components/schemas/DagOutputItem"
          "quack:activity": "#/components/schemas/AgentActivityOutputItem"

    ItemStatus:
      type: string
      enum: [in_progress, completed, incomplete]

    MessageOutputItem:
      type: object
      required: [id, type, status, content]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        status:
          $ref: "#/components/schemas/ItemStatus"
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentPart"

    ContentPart:
      oneOf:
        - $ref: "#/components/schemas/OutputTextPart"
        - $ref: "#/components/schemas/ReasoningPart"
      discriminator:
        propertyName: type
        mapping:
          output_text: "#/components/schemas/OutputTextPart"
          reasoning: "#/components/schemas/ReasoningPart"

    OutputTextPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [output_text]
        text:
          type: string

    ReasoningPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [reasoning]
        text:
          type: string

    # -------------------------------------------------------------------------
    # quack:activity output item - the orchestrator's own tool calls, recovered
    # from session events so chat history (incl. a pending clarification) survives
    # a reload. Discriminated by type "quack:activity".
    # -------------------------------------------------------------------------

    AgentActivityOutputItem:
      type: object
      required: [id, type, status, tool_calls]
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["quack:activity"]
        status:
          $ref: "#/components/schemas/ItemStatus"
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallItem"

    ToolCallItem:
      type: object
      required: [call_id, name]
      properties:
        call_id:
          type: string
        name:
          type: string
        args:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true

    # -------------------------------------------------------------------------
    # quack:dag output item - DAG execution as a first-class output type
    # -------------------------------------------------------------------------

    DagOutputItem:
      type: object
      required: [id, type, status, plan_id, nodes, edges, node_states]
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["quack:dag"]
        status:
          $ref: "#/components/schemas/ItemStatus"
        plan_id:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/DagNodeDef"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DagEdge"
        node_states:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DagNodeState"

    DagNodeDef:
      type: object
      required: [id, agent, task, depends_on]
      properties:
        id:
          type: string
        agent:
          type: string
        task:
          type: string
        depends_on:
          type: array
          items:
            type: string
        context_window:
          type: integer
          description: The assigned agent's configured context_window (0/absent if unset) - the context meter's static limit.

    DagEdge:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string

    DagNodeState:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        pause_reason:
          $ref: "#/components/schemas/PauseReason"
          description: Why the node is paused, present only when status is
            "paused". The wire boundary always normalizes here - a node
            stored as the legacy `needs_input` status reads as
            `paused`/`awaiting_input`.
        pending_question:
          type: string
          description: The unanswered question blocking this node, present
            only when pause_reason is "awaiting_input".
        queued_messages:
          type: array
          items:
            $ref: "#/components/schemas/QueuedMessage"
          description: The node's steer queue - messages waiting for its next
            turn boundary.
        output_preview:
          type: string
        error:
          type: string
        started_at_ms:
          type: integer
        finished_at_ms:
          type: integer
        model:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        finish_reason:
          type: string
        reasoning_tokens:
          type: integer
        cached_tokens:
          type: integer
          description: Subset of prompt_tokens served from the model's prompt cache.
        server_duration_ms:
          type: integer
        judge_rounds:
          type: integer
        judge_final_score:
          type: number
          format: double
        judge_passed:
          type: boolean
        trace_id:
          type: string
          description: OTel trace id for this node's run, for a deep link into
            the tracing backend (see GET /api/v1/config's
            otel_trace_url_template); empty when otel is disabled.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC bearer token, verified against the configured issuer/audience
        (internal/auth.newOIDCVerifier). Enabled only when the deployment sets
        auth.oidc in config/quack.yaml; unconfigured, no request satisfies
        this scheme and trustedHeader (or nothing, if auth is off entirely)
        governs instead.

    trustedHeader:
      type: apiKey
      in: header
      name: X-Authentik-Username
      description: >
        A forward-auth gateway's already-authenticated-user header
        (internal/auth.Auth.trustedIdentity) - present and non-empty is
        trusted outright, taking priority over bearerAuth per request. The
        header NAME is deployment-configured
        (auth.trusted_headers.user in config/quack.yaml, plus an optional
        auth.trusted_headers.groups); X-Authentik-Username is this
        description's example value, not a fixed contract - swap it for
        whatever header your gateway actually sets.
