openapi: 3.0.3
info:
  title: Quack
  version: 0.2.0
  description: |
    Quack's HTTP API, modelled after the OpenResponses specification.
    Each chat turn is a Response containing typed OutputItems. The DAG is a
    first-class output item type (quack:dag) — a custom extension alongside
    the standard message item. The send endpoint streams over Server-Sent Events;
    its vocabulary is documented in prose and via the x-sse-events extension.
servers:
  - url: /

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /api/v1/chats:
    get:
      operationId: listChats
      summary: List chats
      responses:
        "200":
          description: The chats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
    post:
      operationId: createChat
      summary: Create a chat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatBody"
      responses:
        "200":
          description: The created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSummary"

  /api/v1/chats/{chat_id}:
    get:
      operationId: getChat
      summary: Get a chat with its turns
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteChat
      summary: Delete a chat
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "204":
          description: Deleted

  /api/v1/chats/{chat_id}/responses:
    post:
      operationId: sendChatMessage
      summary: Send a message and stream the response
      description: |
        Streams the orchestrator's response as Server-Sent Events. Each event is
        `event: <name>` followed by `data: <json>`.

        The model is flat and agent-centric: the DAG (dag_plan + node_* events) is
        the static structure, and within each node the trust gate runs a SEQUENCE
        of agent invocations ("runs") — an optional formative advisor consult, the
        worker draft, each judge round, and each revision. Every run is delimited
        by `agent_start` / `agent_complete` and carries a `run_id` + `stage`
        (`worker` | `advisor` | `judge` | `revise`); its activity references
        that `run_id`. Clients group runs by `node_id` and pair tools by `call_id`.

        Agent-run events: `agent_start` ({"node_id","run_id","agent","stage","round"})
        opens a run; `agent_thinking` ({"node_id","run_id","text"}) is reasoning;
        `agent_tool_call` ({"node_id","run_id","call_id","name","args"}) and
        `agent_tool_result` ({"node_id","run_id","call_id","name","result"}) are
        tool activity; `agent_token` ({"node_id","run_id","text"}) is answer text
        (the final vetted answer is emitted with an empty `run_id` — it belongs to
        the node); `agent_complete` ({"node_id","run_id","stage",...}) closes a run
        with its stage-specific result — judge runs carry `score`/`passed`/
        `feedback` (or `status:"unavailable"`+`reason` when the judge couldn't
        run), model runs carry `finish_reason` + token usage.

        DAG events: `dag_plan` ({"plan_id","nodes","edges"}) signals a quack:dag
        output item has been added; `node_queued` ({"node_id"}), `node_start`
        ({"node_id","agent"}), `node_done` ({"node_id",...metadata}),
        `node_failed` ({"node_id","error"}), and `node_cancelled` ({"node_id"})
        track node lifecycle.

        Lifecycle: `response_created` ({"response_id"}) is the very first event
        of the stream, naming the turn so a client can cancel this run via
        `PUT /chats/{chat_id}/responses/{response_id}/status`; `chat_title`
        ({"title"}) is sent once the title is generated; `done` ({}) terminates
        the stream; `error` ({"error"}) signals failure.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      x-sse-events:
        - response_created
        - agent_start
        - agent_thinking
        - agent_tool_call
        - agent_tool_result
        - agent_token
        - agent_complete
        - dag_plan
        - node_queued
        - node_start
        - node_done
        - node_failed
        - node_cancelled
        - node_needs_input
        - node_steered
        - chat_title
        - done
        - error
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/chats/{chat_id}/responses/{response_id}:
    get:
      operationId: getResponse
      summary: Get a specific response (turn) with its output items
      description: |
        Returns the full Turn for a response ID. Useful for fetching or
        refreshing a specific turn's output items (e.g. a quack:dag item)
        without reloading the full chat.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ResponseID"
      responses:
        "200":
          description: The response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "404":
          description: Not found

  /api/v1/chats/{chat_id}/stream:
    get:
      operationId: subscribeChatStream
      summary: Subscribe to a chat's live response stream
      description: |
        Connect to the SSE stream of a chat's in-progress (or just-completed) run
        — so a turn started on one device can be watched from another. Replays the
        events so far, then streams live events until the run ends. If no run is
        active, replays the most recent completed run. Reconnect-safe via the
        replay buffer.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      x-sse-events:
        - response_created
        - agent_start
        - agent_thinking
        - agent_tool_call
        - agent_tool_result
        - agent_token
        - agent_complete
        - dag_plan
        - node_queued
        - node_start
        - node_done
        - node_failed
        - node_cancelled
        - node_needs_input
        - node_steered
        - chat_title
        - done
        - error
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/chats/{chat_id}/nodes/{node_id}/status:
    put:
      operationId: updateNodeStatus
      summary: Transition a DAG node's status (cancel, retry, or steer)
      description: |
        A single resource-oriented endpoint replacing the old cancel/steer/retry
        RPC verbs — the request body names the TARGET status:

        - `{"status":"cancelled"}` — cancel the node (legal from `queued`,
          `running`, or `needs_input`). No-op (200, unchanged state) if the node
          isn't currently live.
        - `{"status":"running","guidance":"..."}` — steer: interrupt a RUNNING
          node and re-run it against its SAME session (prior tool calls/results
          retained) with the supplied guidance. Only legal from `running`;
          `guidance` is required (400 without it).
        - `{"status":"queued","guidance":"..."}` — retry: re-run a finished node
          (and every node downstream of it) reusing the stored outputs of all
          other nodes. Only legal from `done`, `failed`, or `cancelled`.
          `guidance` is optional and folded into the node's task.

        An illegal transition (e.g. `done` → `running`) returns 409 naming the
        allowed target statuses. The re-run (steer/retry) streams over the
        chat's existing SSE connection — this endpoint does not open a new one.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeStatusUpdateBody"
      responses:
        "200":
          description: The updated node state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DagNodeState"
        "400":
          description: Bad request (e.g. steer without guidance)
        "404":
          description: No such node
        "409":
          description: Illegal transition; body names the allowed target statuses
            for the node's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionError"

  /api/v1/chats/{chat_id}/responses/{response_id}/status:
    put:
      operationId: updateResponseStatus
      summary: Cancel the chat's active run by response id
      description: |
        `{"status":"cancelled"}` cancels the active orchestrator run for this
        chat — only legal when response_id names the CURRENTLY active run (the
        id surfaced in the stream's opening `response_created` event). 404 if
        this response isn't the active run (already finished, or never was).
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ResponseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseStatusUpdateBody"
      responses:
        "204":
          description: Cancelled
        "400":
          description: Bad request (unsupported target status)
        "404":
          description: This response is not the active run

components:
  parameters:
    ChatID:
      name: chat_id
      in: path
      required: true
      schema:
        type: string

    NodeID:
      name: node_id
      in: path
      required: true
      schema:
        type: string

    ResponseID:
      name: response_id
      in: path
      required: true
      schema:
        type: string

  schemas:

    # -------------------------------------------------------------------------
    # Chat
    # -------------------------------------------------------------------------

    ChatStatus:
      type: string
      description: >
        A chat's derived state: `running` while a turn is actively streaming,
        `needs_input` when the last turn paused on an unanswered question (a
        mid-node ask or a top-level clarification), `failed` when the last
        turn's DAG has a failed node and no answer text followed, else `idle`.
      enum: [running, needs_input, failed, idle]

    ChatSummary:
      type: object
      required: [id, system_prompt, created_at, updated_at, status]
      properties:
        id:
          type: string
        title:
          type: string
        system_prompt:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ChatStatus"
        pending_question:
          type: string
          description: The unanswered question blocking the chat, present only when status is `needs_input`.

    ChatDetail:
      allOf:
        - $ref: "#/components/schemas/ChatSummary"
        - type: object
          required: [turns]
          properties:
            turns:
              type: array
              items:
                $ref: "#/components/schemas/Turn"

    ChatList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChatSummary"

    CreateChatBody:
      type: object
      properties:
        system_prompt:
          type: string

    SendMessageBody:
      type: object
      required: [content]
      properties:
        content:
          type: string

    NodeStatus:
      type: string
      description: |
        A DAG node's canonical lifecycle state. Legal transitions (enforced
        server-side by internal/dag.CanTransition):
          queued      → running, cancelled, failed (stale-on-restart)
          running     → running (steer, in place), needs_input, done, failed, cancelled
          needs_input → running (resumed), cancelled
          done        → queued (retry)
          failed      → queued (retry)
          cancelled   → queued (retry)
      enum: [queued, running, needs_input, done, failed, cancelled]

    NodeStatusUpdateBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        guidance:
          type: string
          description: Required when status is "running" (steer); optional and
            folded into the node's task when status is "queued" (retry).
            Unused for "cancelled".

    ResponseStatus:
      type: string
      description: The only supported target status for a response — cancelling
        the active run. (A separate enum from NodeStatus, which has states with
        no meaning at the response/run level.)
      enum: [cancelled]

    ResponseStatusUpdateBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatus"

    TransitionError:
      type: object
      required: [error, current, allowed]
      properties:
        error:
          type: string
        current:
          $ref: "#/components/schemas/NodeStatus"
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/NodeStatus"

    # -------------------------------------------------------------------------
    # Turn (one user→assistant exchange, modelled after OpenResponses Response)
    # -------------------------------------------------------------------------

    Turn:
      type: object
      required: [id, created_at, input, output]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        input:
          $ref: "#/components/schemas/TurnInput"
        output:
          type: array
          items:
            $ref: "#/components/schemas/OutputItem"
        usage:
          $ref: "#/components/schemas/Usage"
        model:
          type: string
          description: >
            Model that produced the orchestrator's own reply this turn.
            Absent for DAG turns (their models are per-node in DagNodeState).

    TurnInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user]
        content:
          type: string

    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer

    # -------------------------------------------------------------------------
    # Output items — discriminated by `type`
    # Standard: "message". Quack extension: "quack:dag".
    # -------------------------------------------------------------------------

    OutputItem:
      oneOf:
        - $ref: "#/components/schemas/MessageOutputItem"
        - $ref: "#/components/schemas/DagOutputItem"
        - $ref: "#/components/schemas/AgentActivityOutputItem"
      discriminator:
        propertyName: type
        mapping:
          message: "#/components/schemas/MessageOutputItem"
          "quack:dag": "#/components/schemas/DagOutputItem"
          "quack:activity": "#/components/schemas/AgentActivityOutputItem"

    ItemStatus:
      type: string
      enum: [in_progress, completed, incomplete]

    MessageOutputItem:
      type: object
      required: [id, type, status, content]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        status:
          $ref: "#/components/schemas/ItemStatus"
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentPart"

    ContentPart:
      oneOf:
        - $ref: "#/components/schemas/OutputTextPart"
        - $ref: "#/components/schemas/ReasoningPart"
      discriminator:
        propertyName: type
        mapping:
          output_text: "#/components/schemas/OutputTextPart"
          reasoning: "#/components/schemas/ReasoningPart"

    OutputTextPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [output_text]
        text:
          type: string

    ReasoningPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [reasoning]
        text:
          type: string

    # -------------------------------------------------------------------------
    # quack:activity output item — the orchestrator's own tool calls, recovered
    # from session events so chat history (incl. a pending clarification) survives
    # a reload. Discriminated by type "quack:activity".
    # -------------------------------------------------------------------------

    AgentActivityOutputItem:
      type: object
      required: [id, type, status, tool_calls]
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["quack:activity"]
        status:
          $ref: "#/components/schemas/ItemStatus"
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallItem"

    ToolCallItem:
      type: object
      required: [call_id, name]
      properties:
        call_id:
          type: string
        name:
          type: string
        args:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true

    # -------------------------------------------------------------------------
    # quack:dag output item — DAG execution as a first-class output type
    # -------------------------------------------------------------------------

    DagOutputItem:
      type: object
      required: [id, type, status, plan_id, nodes, edges, node_states]
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["quack:dag"]
        status:
          $ref: "#/components/schemas/ItemStatus"
        plan_id:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/DagNodeDef"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DagEdge"
        node_states:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DagNodeState"

    DagNodeDef:
      type: object
      required: [id, agent, task, depends_on]
      properties:
        id:
          type: string
        agent:
          type: string
        task:
          type: string
        depends_on:
          type: array
          items:
            type: string

    DagEdge:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string

    DagNodeState:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        output_preview:
          type: string
        error:
          type: string
        started_at_ms:
          type: integer
        finished_at_ms:
          type: integer
        model:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        finish_reason:
          type: string
        reasoning_tokens:
          type: integer
        server_duration_ms:
          type: integer
        judge_rounds:
          type: integer
        judge_final_score:
          type: number
          format: double
        judge_passed:
          type: boolean
