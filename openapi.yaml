openapi: 3.0.3
info:
  title: Quack
  version: 0.2.0
  description: |
    Quack's HTTP API, modelled after the OpenResponses specification.
    Each chat turn is a Response containing typed OutputItems. The DAG is a
    first-class output item type (quack:dag) - a custom extension alongside
    the standard message item. The send endpoint streams over Server-Sent Events;
    its vocabulary is documented in prose and via the x-sse-events extension.
servers:
  - url: /

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /api/v1/chats:
    get:
      operationId: listChats
      summary: List chats
      parameters:
        - name: limit
          in: query
          required: false
          description: Max chats to return. Defaults to 20; capped at 100.
          schema:
            type: integer
        - name: page_token
          in: query
          required: false
          description: >
            Opaque continuation token from a previous response's `next_page_token`.
            Treat it as an opaque string: never parse or construct one, pass back
            exactly what was returned. Omit for the first page.
          schema:
            type: string
        - name: show_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When false (default), omit archived chats. When true, include them all.
      responses:
        "200":
          description: The chats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
    post:
      operationId: createChat
      summary: Create a chat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatBody"
      responses:
        "200":
          description: The created chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSummary"

  /api/v1/chats/{chat_id}:
    get:
      operationId: getChat
      summary: Get a chat with its turns
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteChat
      summary: Delete a chat
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateChat
      summary: Update a chat's mutable fields
      description: |
        Partial update of a chat's mutable metadata. Today the only settable
        field is `title` (a manual rename - overwrites whatever title, auto-
        generated or previously set, the chat had before); the body shape
        leaves room to grow without a new endpoint.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSummary"
        "404":
          description: No such chat

  /api/v1/recordings:
    get:
      operationId: listRecordings
      summary: List recorded chat sessions
      description: |
        Every session the replay ledger has an entry for (internal/ledger's
        `LedgerStore.List`), backing `quack recording list`/export. 200 with
        an empty array when recording is enabled but nothing has been
        recorded yet; 404 when recording is disabled entirely - same
        disabled signal as `getChatRecording`.
      responses:
        "200":
          description: The recorded sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingList"
        "404":
          description: Recording is not enabled

  /api/v1/chats/{chat_id}/recording:
    get:
      operationId: getChatRecording
      summary: Download a chat's replay-ledger recording bundle
      description: |
        Streams a self-contained ZIP export of the chat's replay ledger:
        `manifest.json` (quack version, gen_ai semconv version, session id,
        recording flags) + `entries.jsonl` (the session's OTel event stream,
        including gate-probe outputs) + an optional `clone.bundle` when a
        clone snapshot was recorded for this session. See
        `.quack/replay-log.md`. 404 when the session has no recording (never
        recorded, already GC'd by retention, or recording disabled).
      parameters:
        - $ref: "#/components/parameters/ChatID"
      responses:
        "200":
          description: The recording bundle (ZIP)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: No recording exists for this chat

  /api/v1/chats/{chat_id}/responses:
    post:
      operationId: sendChatMessage
      summary: Send a message and stream the response
      description: |
        Streams the orchestrator's response as Server-Sent Events. Each event is
        `event: <name>` followed by `data: <json>`.

        The model is flat and agent-centric: the DAG (dag_plan + node_* events) is
        the static structure, and within each node the trust gate runs a SEQUENCE
        of agent invocations ("runs") - the worker draft, each judge round, and
        each revision. Every run is delimited by `agent_start` / `agent_complete`
        and carries a `run_id` + `stage` (`worker` | `judge` | `revise`); its
        activity references that `run_id`. Clients group runs by `node_id` and
        pair tools by `call_id`. A worker's advisor consultations (`ask_advisor`)
        are NOT a separate stage - they surface as ordinary tool activity
        (`agent_tool_call` / `agent_tool_result`) within the worker's own run.

        Agent-run events: `agent_start` ({"node_id","run_id","agent","stage","round"})
        opens a run; `agent_thinking` ({"node_id","run_id","text"}) is reasoning;
        `agent_tool_call` ({"node_id","run_id","call_id","name","args"}) and
        `agent_tool_result` ({"node_id","run_id","call_id","name","result"}) are
        tool activity; `agent_token` ({"node_id","run_id","text"}) is answer text
        (the final vetted answer is emitted with an empty `run_id` - it belongs to
        the node); `agent_complete` ({"node_id","run_id","stage",...}) closes a run
        with its stage-specific result - judge runs carry `score`/`passed`/
        `feedback` (or `status:"unavailable"`+`reason` when the judge couldn't
        run), model runs carry `finish_reason` + token usage.

        DAG events: `dag_plan` ({"plan_id","nodes","edges"}) signals a quack:dag
        output item has been added; `node_queued` ({"node_id"}), `node_start`
        ({"node_id","agent"}), `node_done` ({"node_id",...metadata}),
        `node_failed` ({"node_id","error"}), `node_cancelled` ({"node_id"}), and
        `node_paused` ({"node_id"}) track node lifecycle. `node_steered`
        ({"node_id","guidance"}) fires when a node's queued message(s) are
        delivered at its next turn boundary and it re-runs with them folded
        in. A node's pending queue itself (add/edit/remove) is tracked
        client-side from the POST/PATCH/DELETE `.../queue` responses, not a
        separate SSE event - those calls are synchronous and already tell the
        caller what changed.

        `delivery_result` ({"node_id","outcome","kind","url","error","trace_id"})
        reports one staged item's ACTUAL outward-boundary outcome (push +
        PR/review/comment), as the delivering extension observed it - never the
        worker's self-report. `outcome` is one of `delivered`, `draft` (a
        gate-failed PR opens as a draft), `failed`, or `none` (a judge-passed
        work-request that recorded no delivery attempt at all - the phantom-
        success class this event exists to make visible). Emitted for both
        success and failure, durably, independent of the judge verdict.

        Lifecycle: `response_created` ({"response_id"}) is the very first event
        of the stream, naming the turn so a client can cancel this run via
        `PUT /chats/{chat_id}/responses/{response_id}/status`; `chat_title`
        ({"title"}) is sent once the title is generated; `done` ({}) terminates
        the stream; `error` ({"error"}) signals failure.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      x-sse-events:
        - response_created
        - agent_start
        - agent_thinking
        - agent_tool_call
        - agent_tool_result
        - agent_token
        - agent_complete
        - dag_plan
        - node_queued
        - node_start
        - node_done
        - node_failed
        - node_cancelled
        - node_needs_input
        - node_paused
        - node_steered
        - delivery_result
        - chat_title
        - done
        - error
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/chats/{chat_id}/responses/{response_id}:
    get:
      operationId: getResponse
      summary: Get a specific response (turn) with its output items
      description: |
        Returns the full Turn for a response ID. Useful for fetching or
        refreshing a specific turn's output items (e.g. a quack:dag item)
        without reloading the full chat.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ResponseID"
      responses:
        "200":
          description: The response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Turn"
        "404":
          description: Not found

  /api/v1/chats/{chat_id}/stream:
    get:
      operationId: subscribeChatStream
      summary: Subscribe to a chat's live response stream
      description: |
        Connect to the SSE stream of a chat's in-progress (or just-completed) run
        - so a turn started on one device can be watched from another. Replays the
        events so far, then streams live events until the run ends. If no run is
        active, replays the most recent completed run. Reconnect-safe via the
        replay buffer.
      parameters:
        - $ref: "#/components/parameters/ChatID"
      x-sse-events:
        - response_created
        - agent_start
        - agent_thinking
        - agent_tool_call
        - agent_tool_result
        - agent_token
        - agent_complete
        - dag_plan
        - node_queued
        - node_start
        - node_done
        - node_failed
        - node_cancelled
        - node_needs_input
        - node_paused
        - node_steered
        - delivery_result
        - chat_title
        - done
        - error
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/chats/{chat_id}/nodes/{node_id}/status:
    put:
      operationId: updateNodeStatus
      summary: Transition a DAG node's status (cancel, pause/resume, or retry)
      description: |
        A single resource-oriented endpoint - the request body names the
        TARGET status:

        - `{"status":"cancelled"}` - cancel the node (legal from `queued`,
          `running`, `paused`, or `needs_input`). Kills the in-flight
          model/tool call via context; no resume. No-op (200, unchanged
          state) if the node isn't currently live.
        - `{"status":"paused"}` - suspend a RUNNING node at its next safe
          point, keeping its accumulated work. Only legal from `running`.
        - `{"status":"running"}` - resume a `paused` node: a fresh re-run
          (like retry) that reuses the rest of the plan's stored outputs.
          Only legal from `paused`.
        - `{"status":"queued","guidance":"..."}` - retry: re-run a finished
          node (and every node downstream of it) reusing the stored outputs
          of all other nodes. Only legal from `done`, `failed`, or
          `cancelled`. `guidance` is optional and folded into the node's task.

        To steer a running node with a message, POST to
        `.../nodes/{node_id}/queue` instead - it is delivered at the node's
        next turn boundary, never mid-turn (replaces the old interrupt-based
        steer).

        An illegal transition (e.g. `done` → `running`) returns 409 naming the
        allowed target statuses. The re-run (resume/retry) streams over the
        chat's existing SSE connection - this endpoint does not open a new one.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeStatusUpdateBody"
      responses:
        "200":
          description: The updated node state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DagNodeState"
        "400":
          description: Bad request
        "404":
          description: No such node
        "409":
          description: Illegal transition; body names the allowed target statuses
            for the node's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionError"

  /api/v1/chats/{chat_id}/nodes/{node_id}:
    patch:
      operationId: editNodeTask
      summary: Edit a not-yet-started node's prompt
      description: |
        Replaces a pending node's task text before it starts running. Legal
        only while the node has no live/persisted "started" state (still
        `queued`, and not yet dispatched - e.g. a downstream node waiting on
        its dependencies in an already-streaming turn). Once a node has
        started, its prompt is immutable - 409.
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditNodeTaskBody"
      responses:
        "200":
          description: Edited
        "404":
          description: No such node
        "409":
          description: The node has already started; its prompt is immutable

  /api/v1/chats/{chat_id}/nodes/{node_id}/queue:
    post:
      operationId: queueNodeMessage
      summary: Queue a message for a running node, delivered at its next turn boundary
      description: |
        Appends to the node's message queue - the replacement for the old
        interrupt-based steer. The node drains its queue (in order) at its
        next turn boundary; never mid-turn. Only legal while the node is
        `running` (404 if no live control).
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueMessageBody"
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedMessage"
        "404":
          description: No such node, or the node isn't running right now

  /api/v1/chats/{chat_id}/nodes/{node_id}/queue/{message_id}:
    patch:
      operationId: editQueuedMessage
      summary: Edit a queued message that has not yet been delivered
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
        - $ref: "#/components/parameters/MessageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueMessageBody"
      responses:
        "200":
          description: Edited
        "404":
          description: No such queued message
        "409":
          description: Already delivered; immutable
    delete:
      operationId: removeQueuedMessage
      summary: Remove a queued message that has not yet been delivered
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/NodeID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Removed
        "404":
          description: No such queued message
        "409":
          description: Already delivered; immutable

  /api/v1/chats/{chat_id}/responses/{response_id}/status:
    put:
      operationId: updateResponseStatus
      summary: Cancel the chat's active run by response id
      description: |
        `{"status":"cancelled"}` cancels the active orchestrator run for this
        chat - only legal when response_id names the CURRENTLY active run (the
        id surfaced in the stream's opening `response_created` event). 404 if
        this response isn't the active run (already finished, or never was).
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ResponseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseStatusUpdateBody"
      responses:
        "204":
          description: Cancelled
        "400":
          description: Bad request (unsupported target status)
        "404":
          description: This response is not the active run

  /api/v1/memories:
    get:
      operationId: listMemories
      summary: Browse or search quack's semantic memory
      description: |
        Without `q`: lists a bucket's entries verbatim, newest first - what
        quack believes, not what it would recall for some query. An
        unreachable index is a 500; it never silently falls back to search or
        returns a partial result. With `q`: runs the same embedding search a
        live run's recall would use, so the tab can answer "what would a run
        recall for this?" - entries then carry `score`, ordered descending.
      parameters:
        - name: bucket
          in: query
          description: Restrict to one bucket (e.g. `repo:NightsOut`, `role:coding`, `user:jason`). Omitted lists/searches every bucket.
          schema:
            type: string
        - name: q
          in: query
          description: Run an embedding search instead of listing; matches then carry `score`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Ignored when `q` is set (search ranks by score, not a stable page).
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: The matching memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
        "500":
          description: The memory index is unreachable

  /api/v1/memories/{memory_id}:
    delete:
      operationId: deleteMemory
      summary: Forget one memory
      description: |
        A real delete against the vector index, not a tombstone - if a
        forgotten fact gets re-learned by a later run's consolidation, that's
        a separate concern (suppression), not this endpoint's job.
      parameters:
        - $ref: "#/components/parameters/MemoryID"
      responses:
        "204":
          description: Forgotten
        "404":
          description: No such memory

components:
  parameters:
    ChatID:
      name: chat_id
      in: path
      required: true
      schema:
        type: string

    NodeID:
      name: node_id
      in: path
      required: true
      schema:
        type: string

    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        type: string

    ResponseID:
      name: response_id
      in: path
      required: true
      schema:
        type: string

    MemoryID:
      name: memory_id
      in: path
      required: true
      schema:
        type: string

  schemas:

    # -------------------------------------------------------------------------
    # Chat
    # -------------------------------------------------------------------------

    ChatStatus:
      type: string
      description: >
        A chat's derived state: `queued` when a turn has been admitted but is
        waiting on the server's max_active_runs slot, `running` while a turn
        holds its slot and is actively streaming, `needs_input` when the last
        turn paused on an unanswered question (a mid-node ask, a guarded
        operation awaiting approve/deny - the workspace.guards confirm tier -
        or a top-level clarification), `failed` when the last turn's DAG has a
        failed node and no answer text followed, else `idle`.
      enum: [queued, running, needs_input, failed, idle]

    ChatSummary:
      type: object
      required: [id, system_prompt, created_at, updated_at, status]
      properties:
        id:
          type: string
        title:
          type: string
        system_prompt:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ChatStatus"
        pending_question:
          type: string
          description: The unanswered question blocking the chat, present only when status is `needs_input`.
        github_url:
          type: string
          description: Web URL of the originating GitHub issue/PR, present only for GitHub-originated chats.
        github_repo:
          type: string
          description: "`<owner>/<repo>` of the originating GitHub issue/PR, present only for GitHub-originated chats."
        github_state:
          type: string
          enum: [open, closed, merged, draft]
          description: "Current state of the originating GitHub issue/PR. Only set when quack has observed the resource at dispatch time; absent otherwise."
        archived:
          type: boolean
          description: True if the chat is archived and hidden from the main list by default.

    ChatDetail:
      allOf:
        - $ref: "#/components/schemas/ChatSummary"
        - type: object
          required: [turns]
          properties:
            turns:
              type: array
              items:
                $ref: "#/components/schemas/Turn"

    ChatList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChatSummary"
        next_page_token:
          type: string
          description: >
            Opaque token - pass as `page_token` to fetch the next page. Absent when
            this page is the last. Treat as an opaque string: never parse it.

    # -------------------------------------------------------------------------
    # Semantic memory (the M6 explorer - browse what quack believes, and forget)
    # -------------------------------------------------------------------------

    Memory:
      type: object
      required: [id, content, bucket, author, timestamp, kind]
      properties:
        id:
          type: string
        content:
          type: string
        bucket:
          type: string
          description: repo:<name> / role:<coding|research> / user:<name>, or a legacy raw key.
        author:
          type: string
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
        score:
          type: number
          format: float
          description: Cosine similarity to the search query. Present only when the request set `q`; meaningless (omitted) for a plain listing.

    MemoryList:
      type: object
      required: [memories, total]
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        total:
          type: integer
          description: Total entries matching the filter (not just this page). With `q`, this is just len(memories) - search returns a ranked top-K, not a stable count.

    # -------------------------------------------------------------------------
    # Replay ledger
    # -------------------------------------------------------------------------

    RecordingSummary:
      type: object
      required: [chat_id, size_bytes, modified_at]
      properties:
        chat_id:
          type: string
        size_bytes:
          type: integer
          format: int64
        modified_at:
          type: string
          format: date-time

    RecordingList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSummary"

    CreateChatBody:
      type: object
      properties:
        system_prompt:
          type: string

    SendMessageBody:
      type: object
      required: [content]
      properties:
        content:
          type: string

    NodeStatus:
      type: string
      description: |
        A DAG node's canonical lifecycle state. Legal transitions (enforced
        server-side by internal/dag.CanTransition):
          queued      → running, cancelled, failed (stale-on-restart)
          running     → paused, needs_input, done, failed, cancelled
          paused      → running (resume), cancelled
          needs_input → running (resumed), cancelled
          done        → queued (retry)
          failed      → queued (retry)
          cancelled   → queued (retry)
      enum: [queued, running, needs_input, paused, done, failed, cancelled]

    NodeStatusUpdateBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        guidance:
          type: string
          description: Optional and folded into the node's task when status is
            "queued" (retry, or resuming a paused node via a fresh re-run).
            Unused for "cancelled" and "paused". To steer a RUNNING node,
            queue a message instead (POST .../nodes/{node_id}/queue) - it is
            delivered at the node's next turn boundary, not mid-turn.

    QueuedMessage:
      type: object
      required: [id, text, delivered, created_at]
      properties:
        id:
          type: string
        text:
          type: string
        delivered:
          type: boolean
          description: True once handed to the node at a turn boundary - no
            longer editable or removable.
        created_at:
          type: string
          format: date-time

    QueueMessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string

    EditNodeTaskBody:
      type: object
      required: [task]
      properties:
        task:
          type: string

    UpdateChatBody:
      type: object
      properties:
        title:
          type: string
          description: New title for the chat. Omit to leave unchanged.
        archived:
          type: boolean
          description: Toggle archive. True = archive, False = unarchive. Omit to leave unchanged.

    ResponseStatus:
      type: string
      description: The only supported target status for a response - cancelling
        the active run. (A separate enum from NodeStatus, which has states with
        no meaning at the response/run level.)
      enum: [cancelled]

    ResponseStatusUpdateBody:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatus"

    TransitionError:
      type: object
      required: [error, current, allowed]
      properties:
        error:
          type: string
        current:
          $ref: "#/components/schemas/NodeStatus"
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/NodeStatus"

    # -------------------------------------------------------------------------
    # Turn (one user→assistant exchange, modelled after OpenResponses Response)
    # -------------------------------------------------------------------------

    Turn:
      type: object
      required: [id, created_at, input, output]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        input:
          $ref: "#/components/schemas/TurnInput"
        output:
          type: array
          items:
            $ref: "#/components/schemas/OutputItem"
        usage:
          $ref: "#/components/schemas/Usage"
        model:
          type: string
          description: >
            Model that produced the orchestrator's own reply this turn.
            Absent for DAG turns (their models are per-node in DagNodeState).

    TurnInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user]
        content:
          type: string

    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer

    # -------------------------------------------------------------------------
    # Output items - discriminated by `type`
    # Standard: "message". Quack extension: "quack:dag".
    # -------------------------------------------------------------------------

    OutputItem:
      oneOf:
        - $ref: "#/components/schemas/MessageOutputItem"
        - $ref: "#/components/schemas/DagOutputItem"
        - $ref: "#/components/schemas/AgentActivityOutputItem"
      discriminator:
        propertyName: type
        mapping:
          message: "#/components/schemas/MessageOutputItem"
          "quack:dag": "#/components/schemas/DagOutputItem"
          "quack:activity": "#/components/schemas/AgentActivityOutputItem"

    ItemStatus:
      type: string
      enum: [in_progress, completed, incomplete]

    MessageOutputItem:
      type: object
      required: [id, type, status, content]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        status:
          $ref: "#/components/schemas/ItemStatus"
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentPart"

    ContentPart:
      oneOf:
        - $ref: "#/components/schemas/OutputTextPart"
        - $ref: "#/components/schemas/ReasoningPart"
      discriminator:
        propertyName: type
        mapping:
          output_text: "#/components/schemas/OutputTextPart"
          reasoning: "#/components/schemas/ReasoningPart"

    OutputTextPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [output_text]
        text:
          type: string

    ReasoningPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [reasoning]
        text:
          type: string

    # -------------------------------------------------------------------------
    # quack:activity output item - the orchestrator's own tool calls, recovered
    # from session events so chat history (incl. a pending clarification) survives
    # a reload. Discriminated by type "quack:activity".
    # -------------------------------------------------------------------------

    AgentActivityOutputItem:
      type: object
      required: [id, type, status, tool_calls]
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["quack:activity"]
        status:
          $ref: "#/components/schemas/ItemStatus"
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallItem"

    ToolCallItem:
      type: object
      required: [call_id, name]
      properties:
        call_id:
          type: string
        name:
          type: string
        args:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true

    # -------------------------------------------------------------------------
    # quack:dag output item - DAG execution as a first-class output type
    # -------------------------------------------------------------------------

    DagOutputItem:
      type: object
      required: [id, type, status, plan_id, nodes, edges, node_states]
      properties:
        id:
          type: string
        type:
          type: string
          enum: ["quack:dag"]
        status:
          $ref: "#/components/schemas/ItemStatus"
        plan_id:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/DagNodeDef"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DagEdge"
        node_states:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DagNodeState"

    DagNodeDef:
      type: object
      required: [id, agent, task, depends_on]
      properties:
        id:
          type: string
        agent:
          type: string
        task:
          type: string
        depends_on:
          type: array
          items:
            type: string

    DagEdge:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string

    DagNodeState:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
        output_preview:
          type: string
        error:
          type: string
        started_at_ms:
          type: integer
        finished_at_ms:
          type: integer
        model:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        finish_reason:
          type: string
        reasoning_tokens:
          type: integer
        server_duration_ms:
          type: integer
        judge_rounds:
          type: integer
        judge_final_score:
          type: number
          format: double
        judge_passed:
          type: boolean
