# [Agent name] rubric. [One sentence: what the agent does, what tools it has,
# what the judge is evaluating. If the judge's perception is limited - e.g.
# cannot hear audio, cannot see retrieval log - state it here.]
scale:
  min: 0
  max: 3
  pass: 2
notes: >
  [Domain handling section - include if applicable. E.g. zero-retrieval handling:
  if the agent explicitly states it could not retrieve sources, score `grounded`
  and `cites_sources` at 0 but do not penalise `answers_question` or
  `internally_consistent` - grade those on the honesty of the disclosure.
  Date-awareness: if the answer's searches are scoped to a wrong year, treat as
  a `grounded` failure, not `no_fabrication`.]
criteria:
  criterion_name:
    definition: >
      [What this criterion is measuring. State what counts and what does not.
      Include the key caveat inline if short.]
    guidance: >
      [Longer caveat block if needed - e.g. stale knowledge, no retrieval log,
      no audio, deterministic override.]
    steps:
    - "[Concrete action the judge takes before scoring]"
    - "[Next step]"
    - "[Final step - assign score]"
    bands:
    - min: 3.0
      max: 3.0
      meaning: "[specific observable condition for \"fully met, clean\"]"
    - min: 2.0
      max: 2.0
      meaning: "[specific observable condition for \"met, with one cosmetic/minor flaw that shouldn't block\" - still PASSES]"
    - min: 1.0
      max: 1.0
      meaning: "[specific observable condition for a material gap that FAILS but is a touch-up, not a rethink]"
    - min: 0.0
      max: 0.0
      meaning: "[specific observable condition for the central requirement being unmet]"
    anchors:
    - quote
    - omission
  criterion_name_2:
    # [Repeat the block above for each criterion.]
