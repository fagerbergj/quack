# Skill-library plugins. Trees are not in git; `make plugins` fetches them here.
# A commit ref keeps a deploy from silently changing how agents plan - use a
# branch name to float instead. Shape is parsed by scripts/plugins.sh.
plugins:
  - name: dotagents
    url: https://github.com/fagerbergj/dotagents
    ref: dc452ce4abf593c32d5afcc70d72f6b96db0c0f6
    path: .agents/vendor/dotagents
  - name: ponytail
    url: https://github.com/DietrichGebert/ponytail
    ref: adad50d9b393926b2dd5ed7225dcb1848b9df408
    path: .agents/vendor/ponytail
