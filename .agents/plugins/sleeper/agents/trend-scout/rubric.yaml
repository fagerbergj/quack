scale:
  min: 0
  max: 3
  pass: 2
notes: >
  Every criterion here is drawn from `research-r5-injury-news.md` (R5) via the `sleeper:injury-and-news`
  skill, and from the owner's settled design (`sleeper-agents-and-research.md`, 2026-09-18): Sleeper fields
  win any conflict with web news, and season notes are league-specific learnings, never restated news.
  Web citations follow the same retrieval-backed standard as `web-researcher`'s `cites_sources`/`grounded`
  criteria - a URL not actually fetched or seen in search this session is not grounded.
criteria:
  every_change_dated_and_sourced:
    definition: >
      Every timeline item carries a specific time and a named source - a Sleeper field, or a reporter/outlet
      with a URL actually retrieved this session.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - Check each timeline item has a time (or a clear "since last look" anchor) and a source.
    - >-
      For a web-sourced item, check the URL was fetched or seen in search this session, not merely recalled.
    - >-
      Check aggregator-only claims name the original source per the skill's source ranking, not just the
      aggregator.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: one
        web item cites an aggregator with no original source named.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: one item
        lacks a date or a checkable source.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: multiple items lack a date/source, or a
        cited URL was never actually retrieved this session.
    anchors:
    - quote
    - omission
  sleeper_wins_on_conflict:
    definition: >
      When a Sleeper field and a web report disagree about the same fact, the timeline follows Sleeper
      and states the conflict rather than silently picking the web version or presenting both as equally
      true.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - >-
      Identify any place a Sleeper-sourced fact and a web-sourced fact could conflict (e.g. injury status).
    - Check the answer states which source it followed when they conflict.
    - Check Sleeper's field is the one followed, not the web report.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: no conflicts
        arose this round, and nothing in the answer contradicts the rule.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: a conflict
        exists but isn't explicitly flagged, even though the final call happens to match Sleeper.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: a conflict is resolved in favor of the web
        report over Sleeper's own field.
    anchors:
    - quote
    - omission
  season_notes_are_league_specific:
    definition: >
      Any appended season note is a recurring, league-specific learning (a manager pattern, a scoring/format
      quirk this league misjudges) - never a restatement of this week's news or a generic fantasy-football
      tip.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - >-
      For each appended note, check it names something specific to this league (a manager, a recurring
      pattern, a league setting).
    - Check the note is phrased as forward-looking guidance, not a recap of what just happened.
    - If no note was warranted this round, check none was force-added.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: leans
        slightly toward recapping this week rather than a durable pattern.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: a note
        is added that is generic fantasy-football advice rather than specific to this league.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: the note is a restatement of this week's
        news, or a note is force-added with no real recurring pattern behind it.
    anchors:
    - quote
    - omission
  artifact_delivered:
    definition: >
      The round's deliverable is a `trends` artifact written via write_artifact, not just a timeline described
      in the chat reply - it parses as JSON and carries the schema's required top-level field (an `items`
      array, empty on a quiet round). A season-notes-only round is judged on `season_notes_are_league_specific`
      as well.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - >-
      Check a `trends` artifact exists for this round (list_artifacts/ read_artifact), separate from the
      reply's own text.
    - Parse the artifact's content as JSON.
    - Check an `items` array is present (empty is valid on a quiet round).
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: `items`
        is present and empty despite real changes being described in the reply.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: no artifact
        was written this round - the timeline only exists as prose in the reply.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: the round's content does not parse as JSON
        at all, or no timeline content exists anywhere.
    anchors:
    - quote
    - omission
