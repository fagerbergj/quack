scale:
  min: 0
  max: 3
  pass: 2
notes: >
  Every criterion here is drawn from `research-r2-waivers.md` (R2) via the `sleeper:waivers` skill, primarily
  its "what bad advice looks like" list. The league's actual waiver type is whatever `sleeper_league`
  reports, not assumed - never grade sizing against a waiver type the answer didn't check. The `waivers`
  artifact has no separate bid/priority field; the sized figure belongs in each candidate's `why`. When
  the skill/report states no published number covers a case, an answer that says so is fully grounded
  and must not be penalized for lacking an invented figure.
criteria:
  ranked:
    definition: >
      Waiver candidates are presented as a ranked list, not an unordered dump - the ranking reflects role/usage
      evidence, not raw trending count or ownership alone.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - Check candidates carry an explicit rank or clear ordering.
    - Check the ranking rationale is role/usage-based, not just "most trending" or "highest owned."
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: one
        ranking's rationale leans on a crowd metric more than it should.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: an implicit
        but inconsistent ordering, not stated as a ranking.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: candidates are an unordered list, or ranked
        by trending/ownership count alone.
    anchors:
    - quote
    - omission
  drop_named:
    definition: >
      Every recommended add carries a named drop from the current roster - an add with no drop is not
      an actionable recommendation on a full roster.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - For each recommended add, check a specific roster player is named to drop.
    - Check the drop rationale cites a role change or clear bench-of-bench status, not just "worst name."
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: one
        drop's rationale is thin.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: one add
        has no named drop.
    - min: 0.0
      max: 0.0
      meaning: 'four or more findings, or: four or more findings, or: multiple adds have no named drop.'
    anchors:
    - quote
    - omission
  priority_or_bid_sized_to_waiver_type:
    definition: >
      Waiver priority spend or FAAB bid size, stated in each candidate's `why` (the artifact has no separate
      bid/priority field), matches this league's actual `waiver_type` (checked via `sleeper_league`) and
      this team's remaining resources, using the published bid bands by need tier.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - Check the answer checked or states the league's waiver type before sizing.
    - >-
      For a FAAB bid, check the figure is expressed as a share of *remaining* FAAB (not the original $100)
      and matches the need-tier band (e.g. 25-40% for a replacement starter, $1-2 for K/DEF).
    - >-
      For a priority-queue claim, check the answer weighs the aggressive-vs-patient tradeoff rather than
      assuming one stance.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: one
        figure is a bit off-band without being a category error.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: a bid
        is given with no percentage/dollar figure, or is sized against the original budget instead of
        what remains.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: sizing ignores the league's actual waiver
        type, or a K/DEF bid exceeds the published cap with no stated reason.
    anchors:
    - quote
    - omission
  bye_coverage:
    definition: >
      A bye-week gap in the roster is flagged with the lead time the skill names (1-2 weeks ahead), and
      a double-stacked bye is flagged as a two-slot problem, not treated as a single-slot fix.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - Check any starter's upcoming bye within the lead window is flagged.
    - >-
      Check a double-stacked bye (two rostered players sharing a bye) is named as such, not silently treated
      as one gap.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: the
        lead time is later than the skill's 1-2 week guidance.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: a bye
        gap exists but goes unmentioned.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: a double-stacked bye is treated as a single-slot
        problem, or bye coverage is ignored entirely when relevant.
    anchors:
    - quote
    - omission
  trending_data_interpreted:
    definition: >
      Trending-add counts and ownership % are used as scarcity/bidding context, with the value case made
      on role/usage - never cited as the reason a player is good.
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - >-
      Check any cited trending/ownership number carries its meaning (scarcity signal) rather than being
      framed as evidence of talent.
    - Check a post-box-score trending spike is not treated as new information when usage hasn't changed.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: one
        mention reads slightly more like a value claim than it should.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: a trending
        number is cited without stating what it actually measures.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: a trending/ownership number is used as the
        stated reason a player is worth adding.
    anchors:
    - quote
    - omission
  artifact_delivered:
    definition: >
      The round's deliverable is a `waivers` artifact written via write_artifact, not just a candidate
      list described in the chat reply - it parses as JSON and carries the schema's required top-level
      fields (`week`, a non-empty `candidates` array).
    steps:
    - >-
      Enumerate first: list every item the steps below cover, then apply them to each one. A finding is
      an item that fails one of the steps below. Record each finding with a verbatim quote (or an omission
      naming exactly what is missing); one you cannot quote or name does not count. Pick the band from
      the number of findings; none is the top band.
    - >-
      Check a `waivers` artifact exists for this round (list_artifacts/ read_artifact), separate from
      the reply's own text.
    - Parse the artifact's content as JSON.
    - Check `week` and a non-empty `candidates` array are present.
    bands:
    - min: 3.0
      max: 3.0
      meaning: 'no finding: every item passes the steps above.'
    - min: 2.0
      max: 2.0
      meaning: >-
        exactly one finding, and it is of this kind: exactly one finding, and it is of this kind: one
        required field is missing or empty.
    - min: 1.0
      max: 1.0
      meaning: >-
        two or three findings, or one of this kind: two or three findings, or one of this kind: no artifact
        was written this round - the candidate list only exists as prose in the reply.
    - min: 0.0
      max: 0.0
      meaning: >-
        four or more findings, or: four or more findings, or: the round's content does not parse as JSON
        at all, or no candidate content exists anywhere.
    anchors:
    - quote
    - omission
